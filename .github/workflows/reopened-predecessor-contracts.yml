name: Reopened predecessor contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reopened-predecessors:
    name: Issues 50 and 53 regressions
    runs-on: ubuntu-latest

    steps:
      - name: Check out SynthRAN
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check shell and Python syntax
        run: |
          bash -n deploy.sh
          python -m compileall -q synthran tools/check_reopened_50_53.py

      - name: Run reopened issue regression contracts
        run: python tools/check_reopened_50_53.py
