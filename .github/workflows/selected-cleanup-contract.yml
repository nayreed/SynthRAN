name: Selected testbed teardown contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-cleanup-contract:
    name: Issue 58 selected-resource lifecycle
    runs-on: ubuntu-latest

    steps:
      - name: Check out SynthRAN
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deployment validation runtime
        run: python -m pip install --disable-pip-version-check -e '.[deployment]'

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r deployment/collections/requirements.yml

      - name: Compile Sub 11 control surfaces
        run: >-
          python -m compileall -q
          synthran/teardown.py
          synthran/teardown_controller.py
          synthran/reservation_release.py
          tools/check_selected_cleanup_contract.py

      - name: Parse Sub 11 Ansible YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path("deployment/playbooks/provision_r2lab.yml"),
              Path("deployment/playbooks/teardown.yml"),
              Path("deployment/roles/r2lab/cleanup/tasks/main.yml"),
              Path("deployment/roles/r2lab/ue/stop/tasks/main.yml"),
          ]
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"parsed {len(paths)} selected teardown task files")
          PY

      - name: Validate teardown secret boundary
        run: |
          set -euo pipefail
          grep -q 'SYNTHRAN_R2LAB_PASSWORD_FD' teardown.sh
          ! grep -q 'set -a' teardown.sh
          grep -q 'os.environ.pop("SYNTHRAN_R2LAB_PASSWORD_FD"' synthran/reservation_release.py

      - name: Validate selected-resource teardown and release contract
        run: python tools/check_selected_cleanup_contract.py
