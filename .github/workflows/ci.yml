name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Check shell entrypoint syntax
        run: |
          bash -n deploy.sh
          bash -n experiment.sh

      - name: Compile Python sources
        run: python -m compileall -q synthran Experiments tools/check_acceptance_contract.py

      - name: Validate project metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          assert project["name"] == "synthran"
          assert project["version"]
          assert project["requires-python"]
          print(f"validated pyproject.toml for {project['name']} {project['version']}")
          PY

      - name: Install package and experiment runtime
        run: python -m pip install --disable-pip-version-check -e '.[experiment]'

      - name: Import SynthRAN package
        run: python -c "import synthran; print('synthran import OK')"

      - name: Validate experiment planner
        run: python -m synthran.experiments plan --experiment ex1 --phase all --dry-run

      - name: Run Experiment 1 qualification gate
        run: |
          python Experiments/Ex1_Energy_Correlation_and_Burst_Formation/qualification.py \
            --output "$RUNNER_TEMP/ex1-qualification"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ex1-qualification/qualification.json").read_text()
          )
          assert result["status"] == "passed", result
          assert result["checks_failed"] == [], result
          print(f"qualification passed: {result['checks_passed']}/{result['checks_total']}")
          PY

      - name: Validate calibration selection contracts
        run: |
          python - <<'PY'
          import yaml
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import campaign
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import population_calibration

          manifest = yaml.safe_load(open(
              "Experiments/Ex1_Energy_Correlation_and_Burst_Formation/experiment.yml",
              encoding="utf-8",
          ))
          power_design = manifest["study"]["power_calibration"]
          active = [0.08, 0.21, 0.49, 0.79, 0.94]
          power_rows = [
              {"mean_power_w": power, "active_fraction_mean": fraction}
              for power, fraction in zip(power_design["candidate_mean_power_w"], active)
          ]
          power = campaign._select_power_points(power_rows, power_design)
          assert power["selected"]["low"]["mean_power_w"] == 0.0005, power
          assert power["selected"]["knee"]["mean_power_w"] == 0.001, power
          assert power["selected"]["high"]["mean_power_w"] == 0.002, power

          population_design = manifest["study"]["population_calibration"]
          collisions = [0.01, 0.04, 0.11, 0.22, 0.40]
          decode = [10.0, 20.0, 30.0, 27.0, 15.0]
          population_rows = [
              {
                  "sensor_count": count,
                  "collision_exposure_mean": collision,
                  "decode_rate_per_s_mean": rate,
                  "jain_decode_fairness_mean": 0.9,
              }
              for count, collision, rate in zip(
                  population_design["candidate_sensor_counts"], collisions, decode
              )
          ]
          population = population_calibration._select_population(
              population_rows, population_design
          )
          assert population["selected"]["sensor_count"] == 32, population
          print("calibration selection contracts OK")
          PY

      - name: Validate freeze and confirmation matrix contracts
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import confirmation
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import freeze

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / "calibration/power").mkdir(parents=True)
              (root / "calibration/population").mkdir(parents=True)
              (root / "campaign.json").write_text(json.dumps({
                  "schema_version": 1,
                  "campaign_id": "ci-freeze",
                  "experiment": "ex1",
                  "source_revision": "ci",
              }))
              (root / "calibration/power/selection.json").write_text(json.dumps({
                  "status": "selected",
                  "selected": {
                      "low": {"mean_power_w": 0.0005},
                      "knee": {"mean_power_w": 0.001},
                      "high": {"mean_power_w": 0.002},
                  },
              }))
              (root / "calibration/population/selection.json").write_text(json.dumps({
                  "status": "selected",
                  "selected": {"sensor_count": 32},
              }))
              design = freeze.run(root)
              freeze.validate(design)
              tasks = confirmation.build_tasks(root, design)
              assert len(design["confirmation"]["conditions"]) == 7
              assert len(design["confirmation"]["seeds"]) == 30
              assert design["confirmation"]["sensor_count"] == 32
              assert len(tasks) == 210
              assert len({task["name"] for task in tasks}) == 210
              print("freeze and confirmation matrix contracts OK")
          PY

      - name: Validate analysis metric contracts
        run: |
          python - <<'PY'
          import math
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import analyze

          assert math.isclose(analyze._fano([0, 2, 0, 2]), 1.0)
          assert math.isclose(analyze._gap_cv([0.0, 1.0, 3.0]), 1 / 3)
          bursts = analyze._burst_stats([0.0, 0.5, 2.0, 2.4], 1.0)
          assert bursts["burst_count"] == 2, bursts
          assert bursts["burst_size_max"] == 2, bursts
          ci = analyze._bootstrap_ci([1.0, 2.0, 3.0], resamples=100, seed=7)
          assert ci["n_pairs"] == 3
          assert ci["ci95"][0] is not None and ci["ci95"][1] is not None
          print("analysis metric contracts OK")
          PY

      - name: Validate immutable archive lifecycle
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from synthran import archive

          settings = {
              "enabled": True,
              "backend": "s3",
              "alias": "slices",
              "bucket": "research-bucket",
              "prefix": "SynthRAN/experiments/ex1",
              "remote_verify": True,
          }
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "run"
              root.mkdir()
              science = root / "result.txt"
              science.write_text("scientific evidence\n")
              calls = {}
              archive._mc_binary = lambda: "fake-mc"

              def put(mc, local, remote, expected):
                  assert mc == "fake-mc"
                  assert archive._sha256(local) == expected
                  calls[remote] = expected

              archive._put_immutable = put
              result = archive.archive_directory(
                  root,
                  settings=settings,
                  experiment="ex1",
                  campaign_id="campaign-ci",
                  archive_kind="run",
                  archive_id="run-ci",
                  phase="confirmation",
                  source_revision="deadbeef",
                  remote_suffix="runs/run-ci",
              )
              assert result["archive_status"] == "VERIFIED", result
              assert (root / "_ARCHIVED.json").is_file()
              manifest = json.loads((root / "archive-manifest.json").read_text())
              assert manifest["files"]["result.txt"]["sha256"] == archive._sha256(science)
              assert not any("credential" in key.lower() for key in manifest)
              assert any(path.endswith("/_ARCHIVED.json") for path in calls)

              failed = Path(tmp) / "failed"
              failed.mkdir()
              retained = failed / "result.txt"
              retained.write_text("retain me\n")
              original = archive._sha256(retained)

              def fail_put(*args, **kwargs):
                  raise archive.ArchiveError("object store offline")

              archive._put_immutable = fail_put
              try:
                  archive.archive_directory(
                      failed,
                      settings=settings,
                      experiment="ex1",
                      campaign_id="campaign-ci",
                      archive_kind="run",
                      archive_id="run-failed",
                      phase="confirmation",
                      source_revision="deadbeef",
                      remote_suffix="runs/run-failed",
                  )
              except archive.ArchiveError:
                  pass
              else:
                  raise AssertionError("archive failure did not propagate")
              status = json.loads((failed / "archive-status.json").read_text())
              assert status["archive_status"] == "FAILED", status
              assert archive._sha256(retained) == original
              assert not (failed / "_ARCHIVED.json").exists()
              print("archive lifecycle contracts OK")
          PY

      - name: Validate accepted-testbed and experiment-eligibility contracts
        run: python tools/check_acceptance_contract.py

      - name: Parse versioned YAML and citation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path("synthran/configs/reference.yml")]
          paths += sorted(Path("deployment/group_vars/all").glob("network_profile_*.yaml"))
          paths.append(Path("deployment/group_vars/all/ue_catalog.yaml"))
          paths.append(Path("Experiments/Ex1_Energy_Correlation_and_Burst_Formation/experiment.yml"))
          paths.append(Path("CITATION.cff"))

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"missing expected configuration: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          print(f"parsed {len(paths)} YAML/CFF files")
          PY

      - name: Enforce repository presentation boundaries
        run: |
          if [[ -d scenarios ]]; then
            echo "The duplicated scenarios/ catalog must not be reintroduced" >&2
            exit 1
          fi
          if grep -qE 'readme-(hero|architecture).*\.svg' README.md; then
            echo "README still references removed presentation artwork" >&2
            exit 1
          fi
