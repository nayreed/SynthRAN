---
- name: Cleanup selected R2Lab resources before provisioning
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/cleanup
      vars:
        synthran_cleanup_phase: predeploy
      when:
        - platform == 'r2lab'
        - not no_r2lab_cleanup | default(false)

- name: Power ON RRU on R2Lab
  hosts: faraday
  gather_facts: false
  pre_tasks:
    - name: Start R2Lab RRU setup phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python }}"
          - -m
          - synthran.phase_timing
          - start
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - r2lab_rru_setup
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: platform == 'r2lab'
  roles:
    - role: r2lab/rru
      when: platform == 'r2lab'
  post_tasks:
    - name: Finish R2Lab RRU setup phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python }}"
          - -m
          - synthran.phase_timing
          - finish
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - r2lab_rru_setup
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: platform == 'r2lab'

- name: Prepare selected UEs on R2Lab
  hosts: faraday
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Start R2Lab UE setup phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python }}"
          - -m
          - synthran.phase_timing
          - start
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - ue_setup
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: platform == 'r2lab'

    - name: Resolve the run-scoped nested SSH trust directory
      ansible.builtin.set_fact:
        synthran_nested_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
      when: platform == 'r2lab'

    - name: Create the nested SSH wrapper directory on Faraday
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/bin"
        state: directory
        mode: '0700'
      when: platform == 'r2lab'

    - name: Install the staged SynthRAN SSH verification wrapper on Faraday
      ansible.builtin.copy:
        src: "{{ synthran_execution_root }}/scripts/secure_ssh_wrapper.py"
        dest: "{{ synthran_nested_ssh_dir }}/bin/ssh"
        mode: '0755'
      when: platform == 'r2lab'

    - name: Initialize the run-scoped nested SSH known-hosts file
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/known_hosts"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      when: platform == 'r2lab'

    - name: Power, initialize, and detach the selected R2Lab UEs
      ansible.builtin.include_role:
        name: r2lab/ue/setup
        apply:
          environment:
            PATH: "{{ synthran_nested_ssh_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SYNTHRAN_SSH_KNOWN_HOSTS: "{{ synthran_nested_ssh_dir }}/known_hosts"
      when: platform == 'r2lab'

    - name: Finish R2Lab UE setup phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python }}"
          - -m
          - synthran.phase_timing
          - finish
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - ue_setup
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: platform == 'r2lab'
