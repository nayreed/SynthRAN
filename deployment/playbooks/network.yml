---
- name: Start selected 5G stack deployment timing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Start stack deployment phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python | default(ansible_playbook_python) }}"
          - -m
          - synthran.phase_timing
          - start
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - stack_deployment
      changed_when: false

- name: Configure authoritative N2/N3/N4 host transport
  hosts: sopnodes
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/gre_tunnel

- name: "Deploy the {{ core | upper }} core"
  hosts: core_node
  any_errors_fatal: true
  tasks:
    - name: Configure Open5GS
      ansible.builtin.include_role:
        name: 5g/open5gs/config
      when: core == 'open5gs'
    - name: Deploy Open5GS
      ansible.builtin.include_role:
        name: 5g/open5gs/deploy
      when: core == 'open5gs'
    - name: Prepare the Free5GC host
      ansible.builtin.include_role:
        name: 5g/free5gc/node
      when: core == 'free5gc'
    - name: Configure Free5GC
      ansible.builtin.include_role:
        name: 5g/free5gc/config
      when: core == 'free5gc'
    - name: Deploy Free5GC
      ansible.builtin.include_role:
        name: 5g/free5gc/deploy
      when: core == 'free5gc'

- name: "Deploy the {{ ran | upper }} RAN and software UEs"
  hosts: ran_node
  any_errors_fatal: true
  tasks:
    - name: Validate an explicitly configured immutable OAI charts revision
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_oai_charts_revision is match('^[0-9a-fA-F]{40}$')
        fail_msg: synthran_oai_charts_revision must be an immutable 40-hex Git revision.
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_revision is defined
        - synthran_oai_charts_revision | string | length > 0

    - name: Resolve the OAI R2Lab charts branch once for this run
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - https://gitlab.eurecom.fr/turletti/charts.git
          - refs/heads/main
      register: synthran_oai_charts_lookup
      changed_when: false
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_revision is not defined or synthran_oai_charts_revision | string | length == 0

    - name: Freeze the resolved OAI charts revision
      ansible.builtin.set_fact:
        synthran_oai_charts_revision: "{{ synthran_oai_charts_lookup.stdout.split()[0] }}"
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_lookup is not skipped

    - name: Require the OAI charts source to be immutable before preparation
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_oai_charts_revision is defined
          - synthran_oai_charts_revision is match('^[0-9a-fA-F]{40}$')
        fail_msg: OAI deployment requires a resolved immutable charts revision.
      when: core == 'oai' or ran == 'oai'

    - name: Configure OAI
      ansible.builtin.include_role:
        name: 5g/oai/config
      when: core == 'oai' or ran == 'oai'
    - name: Prepare OAI
      ansible.builtin.include_role:
        name: 5g/oai/setup
      when: core == 'oai' or ran == 'oai'
    - name: Deploy the OAI core
      ansible.builtin.include_role:
        name: 5g/oai/core
      when: core == 'oai'

    - name: Enforce exclusive physical RAN ownership before backend startup
      ansible.builtin.include_role:
        name: 5g/ran_transition
      when:
        - platform | string | trim | lower == 'r2lab'
        - rru | string | trim | lower in ['n300', 'n320']
        - ran | string | trim | lower in ['oai', 'srsran']

    - name: Deploy the OAI RAN
      ansible.builtin.include_role:
        name: 5g/oai/ran
      when: ran == 'oai'
    - name: Configure srsRAN
      ansible.builtin.include_role:
        name: 5g/srsRAN/config
      when: ran | lower == 'srsran'
    - name: Deploy srsRAN
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
      when: ran | lower == 'srsran'
    - name: Configure UERANSIM
      ansible.builtin.include_role:
        name: 5g/ueransim/config
      when: ran == 'ueransim'
    - name: Deploy UERANSIM
      ansible.builtin.include_role:
        name: 5g/ueransim/deploy
      when: ran == 'ueransim'

- name: Finish selected 5G stack deployment timing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Finish stack deployment phase timing
      ansible.builtin.command:
        argv:
          - "{{ synthran_controller_python | default(ansible_playbook_python) }}"
          - -m
          - synthran.phase_timing
          - finish
          - --run-dir
          - "{{ run_dir }}"
          - --phase
          - stack_deployment
      changed_when: false
