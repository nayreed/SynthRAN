---
- name: Prepare the shareable runtime provenance directory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create the run provenance directory
      ansible.builtin.file:
        path: "{{ run_dir }}/provenance"
        state: directory
        mode: '0755'

- name: Record bounded host runtime provenance
  hosts: sopnodes
  gather_facts: true
  become: true
  any_errors_fatal: true
  tasks:
    - name: Read kubelet version
      ansible.builtin.command: kubelet --version
      register: synthran_prov_kubelet
      changed_when: false
      failed_when: false

    - name: Read containerd version
      ansible.builtin.command: containerd --version
      register: synthran_prov_containerd
      changed_when: false
      failed_when: false

    - name: Read Helm version
      ansible.builtin.command: helm version --short
      register: synthran_prov_helm
      changed_when: false
      failed_when: false

    - name: Read yq version
      ansible.builtin.command: /usr/local/bin/yq --version
      register: synthran_prov_yq
      changed_when: false
      failed_when: false

    - name: Read Kubernetes Python client version
      ansible.builtin.command:
        argv:
          - /opt/ansible-venv/bin/python
          - -c
          - 'import kubernetes; print(kubernetes.__version__)'
      register: synthran_prov_kubernetes_python
      changed_when: false
      failed_when: false

    - name: Read installed Debian package versions
      ansible.builtin.shell: |
        set -euo pipefail
        dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort
      args:
        executable: /bin/bash
      register: synthran_prov_packages
      changed_when: false
      failed_when: false
      when: ansible_os_family == 'Debian'

    - name: Read UHD userspace version when available
      ansible.builtin.command: uhd_config_info --version
      register: synthran_prov_uhd
      changed_when: false
      failed_when: false
      when: inventory_hostname == ran_node_name and (rru | lower) in ['n300', 'n320']

    - name: Retain sanitized host provenance
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        mode: '0644'
        dest: "{{ run_dir }}/provenance/host-{{ inventory_hostname }}.json"
        content: >-
          {{ {
               'schema_version': 2,
               'host': inventory_hostname,
               'distribution': ansible_distribution,
               'distribution_version': ansible_distribution_version,
               'kernel': ansible_kernel,
               'architecture': ansible_architecture,
               'host_preparation': synthran_host_preparation,
               'kubelet': synthran_prov_kubelet.stdout | default(''),
               'containerd': synthran_prov_containerd.stdout | default(''),
               'helm': synthran_prov_helm.stdout | default(''),
               'yq': synthran_prov_yq.stdout | default(''),
               'kubernetes_python': synthran_prov_kubernetes_python.stdout | default(''),
               'packages': synthran_prov_packages.stdout_lines | default([]),
               'uhd': synthran_prov_uhd.stdout | default('')
             } | to_nice_json }}

- name: Record raw selected-namespace cluster provenance
  hosts: core_node
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Collect a read-only Kubernetes and Helm snapshot
      ansible.builtin.script:
        cmd: >-
          {{ synthran_execution_root }}/scripts/collect_cluster_snapshot.py
          --namespace {{ synthran_deployment_contract.deployment.topology.namespace | quote }}
        executable: /usr/bin/python3
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: synthran_cluster_snapshot
      changed_when: false

    - name: Require the cluster snapshot to be valid JSON
      ansible.builtin.set_fact:
        synthran_cluster_snapshot_document: "{{ synthran_cluster_snapshot.stdout | from_json }}"

    - name: Retain the raw sanitized cluster snapshot
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        mode: '0644'
        dest: "{{ run_dir }}/provenance/cluster.json"
        content: "{{ synthran_cluster_snapshot_document | to_nice_json }}"

    - name: Retain observed OAI source revisions when selected
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        mode: '0644'
        dest: "{{ run_dir }}/provenance/oai-sources.json"
        content: >-
          {{ {
               'schema_version': 2,
               'oai5g_rru_revision': hostvars[ran_node_name].oai_helper_revision.stdout | trim,
               'oai_charts_revision': hostvars[ran_node_name].oai_charts_revision.stdout | trim
             } | to_nice_json }}
      when:
        - core == 'oai' or ran == 'oai'
        - hostvars[ran_node_name].oai_helper_revision is defined
        - hostvars[ran_node_name].oai_charts_revision is defined

- name: Record non-mutating physical UE helper provenance
  hosts: physical_ues
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Hash installed modem helper identities without changing modem state
      ansible.builtin.shell: |
        set -e
        for helper in qhat-check qhat-init start.sh stop.sh quectel-CM ci_ctl_qtel.py; do
          path="$(command -v "$helper" 2>/dev/null || true)"
          if [ -n "$path" ] && [ -f "$path" ]; then
            printf '%s ' "$helper"
            sha256sum "$path" | awk '{print $1}'
          fi
        done
      args:
        executable: /bin/bash
      register: synthran_modem_helper_hashes
      changed_when: false
      when: platform in ['r2lab', 'physical']

    - name: Retain physical UE helper provenance
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        mode: '0644'
        dest: "{{ run_dir }}/provenance/ue-{{ inventory_hostname }}.json"
        content: >-
          {{ {
               'schema_version': 1,
               'host': inventory_hostname,
               'helper_sha256_lines': synthran_modem_helper_hashes.stdout_lines | default([])
             } | to_nice_json }}
      when: platform in ['r2lab', 'physical']
