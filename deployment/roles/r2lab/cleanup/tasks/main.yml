---
- name: Resolve selected R2Lab cleanup identity from the deployment contract
  ansible.builtin.set_fact:
    r2lab_cleanup_phase: "{{ synthran_cleanup_phase | default('predeploy') }}"
    r2lab_selected_ues: "{{ synthran_ue_map | map(attribute='device') | list }}"
    r2lab_inventory_ues: >-
      {{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) }}

- name: Require every selected UE to exist in the R2Lab inventory
  ansible.builtin.assert:
    quiet: true
    that:
      - r2lab_cleanup_phase in ['predeploy', 'teardown']
      - r2lab_selected_ues | unique | length == r2lab_selected_ues | length
      - r2lab_selected_ues | difference(r2lab_inventory_ues) | length == 0
    fail_msg: >-
      One or more deployment-contract UEs are absent from the R2Lab inventory;
      refusing ambiguous cleanup. Unselected inventory UEs remain untouched.

- name: Resolve the run-scoped selected-UE SSH trust path
  ansible.builtin.set_fact:
    r2lab_cleanup_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
    r2lab_cleanup_known_hosts: "/tmp/synthran-ssh-{{ run_dir | basename }}/known_hosts"

- name: Create the selected-UE SSH trust directory on Faraday
  ansible.builtin.file:
    path: "{{ r2lab_cleanup_ssh_dir }}"
    state: directory
    mode: '0700'

- name: Initialize the selected-UE SSH known-hosts file on Faraday
  ansible.builtin.file:
    path: "{{ r2lab_cleanup_known_hosts }}"
    state: touch
    mode: '0600'
    access_time: preserve
    modification_time: preserve

- name: Stop each selected R2Lab UE exactly once
  ansible.builtin.include_role:
    name: r2lab/ue/stop
  vars:
    synthran_r2lab_ue: "{{ synthran_cleanup_ue }}"
    synthran_cleanup_phase: "{{ r2lab_cleanup_phase }}"
    synthran_r2lab_stop_known_hosts: "{{ r2lab_cleanup_known_hosts }}"
  loop: "{{ synthran_ue_map }}"
  loop_control:
    loop_var: synthran_cleanup_ue
    label: "{{ synthran_cleanup_ue.device }}"

- name: Power OFF only the selected RRU with the SophiaNode R2Lab helper
  ansible.builtin.shell: |
    set -e
    source ~/.bashrc
    rhubarbe-pdu off "{{ rru }}"
  args:
    executable: /bin/bash
  register: selected_rru_power_off
  # Rhubarbe PDU action status is 0=ON, 1=OFF, 255=failure. For the
  # 'off' action, rc=1 is therefore the successful terminal state.
  changed_when: selected_rru_power_off.rc == 1
  failed_when: false
  when: rru | default('rfsim') != 'rfsim'

- name: Retain selected RRU power-off evidence before enforcing success
  ansible.builtin.copy:
    content: |
      phase={{ r2lab_cleanup_phase }}
      rru={{ rru }}
      command=rhubarbe-pdu off {{ rru }}
      rhubarbe_status_contract=0:ON,1:OFF,255:failure
      expected_rc=1
      rc={{ selected_rru_power_off.rc | default('not-run') }}
      stdout={{ selected_rru_power_off.stdout | default('') }}
      stderr={{ selected_rru_power_off.stderr | default('') }}
    dest: "{{ run_dir }}/r2lab-rru-{{ rru }}-{{ r2lab_cleanup_phase }}-stop.log"
  delegate_to: localhost
  become: false
  when: rru | default('rfsim') != 'rfsim'

- name: Require selected RRU power-off to succeed
  ansible.builtin.assert:
    quiet: true
    that:
      - selected_rru_power_off.rc == 1
    fail_msg: >-
      Selected RRU power-off failed for {{ rru }} during {{ r2lab_cleanup_phase }}
      cleanup. See r2lab-rru-{{ rru }}-{{ r2lab_cleanup_phase }}-stop.log;
      unrelated R2Lab resources were not used as a recovery path.
  when: rru | default('rfsim') != 'rfsim'

- name: Allow selected N3xx RRU power rail to settle after power-off
  ansible.builtin.pause:
    seconds: "{{ synthran_cleanup_power_settle_seconds | default(20) | int }}"
  when:
    - rru in ['n300', 'n320']
    - (synthran_cleanup_power_settle_seconds | default(20) | int) > 0
