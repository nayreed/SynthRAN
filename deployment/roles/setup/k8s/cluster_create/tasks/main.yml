---
- name: Normalize deployment boolean for current host
  ansible.builtin.set_fact:
    bridge_enabled: "{{ bridge_enabled | default(false) | bool }}"

# Fresh provisioning only. bootstrap_nodes.yml prevents this role from running
# when host_preparation=preserve.
- name: Stop kubelet before reset
  ansible.builtin.systemd:
    name: kubelet
    state: stopped
  become: true
  failed_when: false

- name: Kill orphan static pod processes
  ansible.builtin.shell: |
    for proc in kube-apiserver kube-controller-manager kube-scheduler etcd; do
      pkill -9 -x "$proc" 2>/dev/null || true
    done
  become: true
  changed_when: false

- name: Wait for control-plane ports to be released
  ansible.builtin.shell: |
    for port in 6443 10259; do
      for i in $(seq 1 15); do
        ss -tlnp | grep -q ":${port} " || break
        sleep 2
      done
      if ss -tlnp | grep -q ":${port} "; then
        ss -tlnp | grep ":${port} "
        exit 1
      fi
    done
  become: true
  changed_when: false

- name: Reset the previous Kubernetes control plane
  ansible.builtin.command: kubeadm reset -f
  register: kubeadm_reset
  changed_when: kubeadm_reset.rc == 0
  failed_when: false
  become: true

- name: Remove previous Kubernetes and CNI state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /var/lib/etcd
    - /etc/cni
    - /opt/cni
    - /var/lib/cni
    - /run/flannel
  become: true
  loop_control:
    label: "{{ item }}"

- name: Clear generated kubelet state while preserving its mountpoint
  ansible.builtin.shell: |
    find /var/lib/kubelet -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
  become: true
  changed_when: false

- name: Verify pre-k8s containerd storage binding before destructive cleanup
  ansible.builtin.shell: |
    fstype=$(findmnt -n -o FSTYPE /var/lib/containerd 2>/dev/null | head -1 || echo "NOT_MOUNTED")
    echo "$fstype"
    case "$fstype" in
      ext4|xfs|btrfs) exit 0 ;;
      *) exit 1 ;;
    esac
  register: cluster_containerd_fstype
  changed_when: false
  become: true

- name: Stop containerd before clearing previous cluster data
  ansible.builtin.systemd:
    name: containerd
    state: stopped
  become: true

- name: Remove stale containerd cluster data
  ansible.builtin.shell: |
    rm -rf /var/lib/containerd/io.containerd.content.v1.content
    rm -rf /var/lib/containerd/io.containerd.metadata.v1.bolt
    rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
    rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.native
    rm -rf /var/lib/containerd/io.containerd.runtime.v1.linux
    rm -rf /var/lib/containerd/io.containerd.runtime.v2.task
    rm -rf /var/lib/containerd/io.containerd.grpc.v1.cri
    rm -rf /var/lib/containerd/tmpmounts
  become: true

- name: Create overlayfs snapshotter directory
  ansible.builtin.file:
    path: /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
    state: directory
    mode: '0755'
  become: true

- name: Expose overlayfs capacity statistics to CRI
  ansible.builtin.shell: |
    findmnt /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs &>/dev/null || \
      mount --bind /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs \
                   /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
  become: true
  changed_when: false

- name: Restart containerd after clearing previous cluster data
  ansible.builtin.systemd:
    name: containerd
    state: started
  become: true

- name: Wait for containerd to accept requests
  ansible.builtin.command: ctr version
  register: containerd_ready_after_wipe
  changed_when: false
  retries: 30
  delay: 1
  until: containerd_ready_after_wipe.rc == 0

- name: Upload kubeadm config to master node
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /root/kubeadm-config.yaml
    mode: '0600'
  become: true

- name: Initialize Kubernetes cluster
  ansible.builtin.command: kubeadm init --config /root/kubeadm-config.yaml
  register: kubeadm_init
  become: true

- name: Remove rootDir from kubeadm-generated kubelet config if present
  ansible.builtin.lineinfile:
    path: /var/lib/kubelet/config.yaml
    regexp: '^\s*rootDir:'
    state: absent
  become: true

- name: Configure kubelet storage eviction thresholds
  ansible.builtin.blockinfile:
    path: /var/lib/kubelet/config.yaml
    block: |
      evictionHard:
        nodefs.available: "{{ '2%' if core_node_name == ran_node_name else '10%' }}"
        imagefs.available: "{{ '2%' if core_node_name == ran_node_name else '10%' }}"
      {% if core_node_name == ran_node_name %}
      evictionMinimumReclaim:
        nodefs.available: "500Mi"
      {% endif %}
      imageGCHighThresholdPercent: 85
      imageGCLowThresholdPercent: 80
    marker: "# {mark} KUBELET STORAGE PATCH"
  become: true

- name: Configure kubelet DNS resolution
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS=--resolv-conf=/run/systemd/resolve/resolv.conf
    mode: '0644'
  become: true

- name: Restart kubelet after generated configuration is patched
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  become: true

- name: Enable cluster CIDR allocation in kube-controller-manager
  ansible.builtin.lineinfile:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*- --allocate-node-cidrs=', line: '    - --allocate-node-cidrs=true' }
    - { regexp: '^\s*- --cluster-cidr=', line: '    - --cluster-cidr=10.244.0.0/16' }
  loop_control:
    label: "{{ item.line | trim }}"
  become: true

- name: Create .kube directory in user's home
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0700'

- name: Copy admin.conf to kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    mode: '0600'
  become: true

- name: Ensure CNI directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/cni/net.d
    - /opt/cni/bin
    - /var/lib/cni
  become: true

- name: Clean old or conflicting CNI configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cni/net.d/00-multus.conf
    - /etc/cni/net.d/00-multus.conf.bak
    - /etc/cni/net.d/10-flannel.conf
    - /etc/cni/net.d/10-flannel.conf~
  become: true

- name: Deploy Flannel CNI conflist
  ansible.builtin.copy:
    dest: /etc/cni/net.d/10-flannel.conflist
    mode: '0644'
    content: |
      {
        "name": "cbr0",
        "cniVersion": "0.3.1",
        "plugins": [
          {
            "type": "flannel",
            "delegate": {
              "hairpinMode": true,
              "isDefaultGateway": true
            }
          },
          {
            "type": "portmap",
            "capabilities": {
              "portMappings": true
            }
          }
        ]
      }
  become: true

- name: Extract the checksum-verified CNI plugin bundle staged by bootstrap_nodes.yml
  ansible.builtin.unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
  become: true

- name: Ensure kube-flannel namespace exists
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-flannel
        labels:
          pod-security.kubernetes.io/enforce: privileged
    state: present
    kubeconfig: /etc/kubernetes/admin.conf

- name: Add Flannel Helm repo
  kubernetes.core.helm_repository:
    name: flannel
    repo_url: https://flannel-io.github.io/flannel/
    kubeconfig: /etc/kubernetes/admin.conf

- name: Install Flannel via Helm
  kubernetes.core.helm:
    name: flannel
    chart_ref: flannel/flannel
    release_namespace: kube-flannel
    state: present
    wait: true
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      podCidr: "10.244.0.0/16"
      flannel:
        iface: "{{ hostvars[inventory_hostname].nic_interface | default('eth0') }}"

- name: Restart containerd and kubelet to reload CNI
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - containerd
    - kubelet
  become: true

- name: Wait until the control-plane node is Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - wait
      - "node/{{ inventory_hostname }}"
      - --for=condition=Ready
      - --timeout=180s
  register: wait_ready
  retries: 3
  delay: 10
  until: wait_ready.rc == 0
  changed_when: false
  become: true

- name: Wait for CoreDNS pods to be Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - wait
      - -n
      - kube-system
      - --for=condition=Ready
      - pod
      - -l
      - k8s-app=kube-dns
      - --timeout=300s
  changed_when: false
  become: true

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  delegate_to: "{{ groups['core_node'][0] }}"
  run_once: true
  no_log: true

- name: Save join command in private run directory
  ansible.builtin.copy:
    content: "{{ join_cmd.stdout }}"
    dest: "{{ synthran_private_dir }}/kubeadm_join_command.txt"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
