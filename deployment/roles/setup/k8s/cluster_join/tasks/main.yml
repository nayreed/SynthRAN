---
- name: Stop any previous CNI DHCP daemon before replacing CNI state
  ansible.builtin.systemd:
    name: cni-dhcp.service
    state: stopped
    enabled: false
    daemon_reload: true
  become: true
  failed_when: false

- name: Check if node has leftover Kubernetes data
  ansible.builtin.stat:
    path: /etc/kubernetes
  register: kube_dir

- name: Reset node if Kubernetes data exists
  ansible.builtin.command: kubeadm reset -f
  when: kube_dir.stat.exists
  register: worker_kubeadm_reset
  changed_when: worker_kubeadm_reset.rc == 0
  failed_when: false
  become: true

- name: Remove all Kubernetes and CNI state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /etc/cni
    - /var/lib/kubelet
    - /var/lib/cni
    - /run/flannel
  when: kube_dir.stat.exists
  become: true
  loop_control:
    label: "{{ item }}"

- name: Stop containerd before full data wipe
  ansible.builtin.systemd:
    name: containerd
    state: stopped
  become: true

- name: Remove stale containerd cluster data
  ansible.builtin.shell: |
    rm -rf /var/lib/containerd/io.containerd.content.v1.content
    rm -rf /var/lib/containerd/io.containerd.metadata.v1.bolt
    rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
    rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.native
    rm -rf /var/lib/containerd/io.containerd.runtime.v1.linux
    rm -rf /var/lib/containerd/io.containerd.runtime.v2.task
    rm -rf /var/lib/containerd/io.containerd.grpc.v1.cri
    rm -rf /var/lib/containerd/tmpmounts
  become: true

- name: Restart containerd after full wipe
  ansible.builtin.systemd:
    name: containerd
    state: started
  become: true

- name: Wait for containerd to accept requests after the wipe
  ansible.builtin.command: ctr version
  register: worker_containerd_ready
  changed_when: false
  retries: 30
  delay: 1
  until: worker_containerd_ready.rc == 0

- name: Ensure CNI directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/cni/net.d
    - /opt/cni/bin
    - /var/lib/cni
  become: true

- name: Resolve the supported CNI plugin architecture
  ansible.builtin.set_fact:
    synthran_worker_cni_arch: >-
      {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else
         'arm64' if ansible_architecture in ['aarch64', 'arm64'] else '' }}

- name: Require a checksum-pinned CNI plugin bundle for the worker architecture
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_worker_cni_arch | length > 0
      - synthran_worker_cni_arch in cni_plugins_sha256
    fail_msg: >-
      No checksum-pinned CNI plugin bundle is defined for architecture
      {{ ansible_architecture }}.

- name: Download the checksum-verified CNI plugin bundle
  ansible.builtin.get_url:
    url: >-
      https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ synthran_worker_cni_arch }}-v{{ cni_plugins_version }}.tgz
    dest: /tmp/cni-plugins.tgz
    mode: '0600'
    force: true
    checksum: "sha256:{{ cni_plugins_sha256[synthran_worker_cni_arch] }}"
  become: true

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
  become: true

- name: Set CNI plugin permissions
  ansible.builtin.file:
    path: /opt/cni/bin
    owner: root
    group: root
    mode: '0755'
    recurse: true
  become: true

- name: Verify essential CNI binaries exist
  ansible.builtin.stat:
    path: "/opt/cni/bin/{{ item }}"
  loop:
    - loopback
    - bridge
    - portmap
    - dhcp
  register: cni_check
  become: true

- name: Validate the essential CNI plugins
  ansible.builtin.assert:
    that: >-
      cni_check.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing CNI plugins on {{ inventory_hostname }}:
      {{ cni_check.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
    success_msg: All essential CNI plugins are installed

- name: Ensure /root/.kube exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'
  become: true

- name: Fetch admin.conf from master into the private run directory
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ synthran_private_dir }}/admin.conf"
    flat: true
  delegate_to: "{{ groups['core_node'][0] }}"
  when: inventory_hostname == groups['k8s_workers'][0]
  no_log: true

- name: Restrict fetched administrator configuration
  ansible.builtin.file:
    path: "{{ synthran_private_dir }}/admin.conf"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['k8s_workers'][0]
  no_log: true

- name: Copy admin.conf to worker node
  ansible.builtin.copy:
    src: "{{ synthran_private_dir }}/admin.conf"
    dest: /root/.kube/config
    mode: '0600'
  become: true
  no_log: true

- name: Ensure master CORE node is resolvable
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[groups['core_node'][0]].ip }} {{ groups['core_node'][0] }}"
  become: true

- name: Set kubelet RAN node IP explicitly
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ hostvars[inventory_hostname].ip }}
  become: true

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  become: true

- name: Remove stale node entry from cluster
  delegate_to: "{{ groups['core_node'][0] }}"
  become: true
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - node
      - "{{ inventory_hostname }}"
      - --ignore-not-found
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Read join command from the private run directory
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ lookup('file', synthran_private_dir ~ '/kubeadm_join_command.txt') }}"
  no_log: true

- name: Report the Kubernetes join target
  ansible.builtin.debug:
    msg: "Joining {{ inventory_hostname }} to {{ groups['core_node'][0] }}"

- name: Join node to the cluster
  ansible.builtin.command: "{{ kubeadm_join_command }} --ignore-preflight-errors=SystemVerification --v=5"
  become: true
  no_log: true

- name: Wait until CoreDNS pods are Ready
  become: true
  delegate_to: "{{ groups['core_node'][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ansible.builtin.shell: |
    set -e
    kubectl wait -n kube-system \
      --for=condition=Ready pod -l k8s-app=kube-dns \
      --timeout=300s
  register: coredns_wait
  retries: 5
  delay: 15
  until: coredns_wait.rc == 0
  changed_when: false

- name: Collect CoreDNS diagnostics when readiness fails
  when: coredns_wait.rc != 0
  become: true
  delegate_to: "{{ groups['core_node'][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ansible.builtin.shell: |
    kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide
    kubectl describe pods -n kube-system -l k8s-app=kube-dns | tail -n 50
  changed_when: false

- name: Test CoreDNS resolution from core and RAN nodes
  become: true
  delegate_to: "{{ groups['core_node'][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ansible.builtin.shell: |
    set -eux
    for NODE in {{ groups['core_node'][0] }} {{ groups['ran_node'][0] }}; do
      kubectl run dns-test-$NODE \
        --image=busybox:1.36 \
        --restart=Never \
        --overrides='{"spec": {"nodeName": "'"${NODE}"'"}}' \
        --command -- sh -c 'nslookup kubernetes.default.svc.cluster.local' || true
    done
    kubectl delete pod dns-test-{{ groups['core_node'][0] }} --ignore-not-found
    kubectl delete pod dns-test-{{ groups['ran_node'][0] }} --ignore-not-found
  changed_when: false

- name: Remove fetched administrator configuration after the join
  ansible.builtin.file:
    path: "{{ synthran_private_dir }}/admin.conf"
    state: absent
  delegate_to: localhost
  become: false
  no_log: true

- name: Remove consumed kubeadm join command after the join
  ansible.builtin.file:
    path: "{{ synthran_private_dir }}/kubeadm_join_command.txt"
    state: absent
  delegate_to: localhost
  become: false
  no_log: true
