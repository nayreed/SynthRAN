---
# Prepare the selected real filesystem before Kubernetes is installed. This role
# owns containerd storage binding only; kubelet configuration is generated and
# patched later by the cluster-creation role.

- name: Detect live Ubuntu system
  ansible.builtin.shell: |
    grep -q "boot=live" /proc/cmdline && echo "live" || echo "persistent"
  register: live_image_check
  changed_when: false
  become: true

- name: Ensure selected storage device exists
  ansible.builtin.stat:
    path: "/dev/{{ storage }}"
  register: storage_device
  become: true

- name: Validate the selected containerd storage device
  ansible.builtin.assert:
    quiet: true
    that:
      - storage_device.stat.exists
      - storage_device.stat.isblk | default(false)
    fail_msg: "Storage device /dev/{{ storage }} does not exist or is not a block device"

- name: Create containerd mount point
  ansible.builtin.file:
    path: /var/lib/containerd
    state: directory
    mode: '0755'
  become: true

- name: Detect whether selected storage already backs containerd
  ansible.builtin.shell: |
    set -eu
    current="$(findmnt --nofsroot -n -o SOURCE /var/lib/containerd 2>/dev/null || true)"
    selected="$(readlink -f /dev/{{ storage }})"
    if [ -n "$current" ] && [ "$(readlink -f "$current")" = "$selected" ]; then
      echo selected
    else
      echo other
    fi
  args:
    executable: /bin/bash
  register: containerd_existing_binding
  changed_when: false
  become: true

- name: Stop containerd before changing its storage binding
  ansible.builtin.systemd:
    name: containerd
    state: stopped
  become: true
  when: containerd_existing_binding.stdout | trim != 'selected'

- name: Remove stale /var/lib/containerd fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*/var/lib/containerd.*'
    state: absent
  become: true
  when: containerd_existing_binding.stdout | trim != 'selected'

- name: Clear stale containerd mounts
  ansible.builtin.shell: |
    for i in $(seq 1 10); do
      findmnt /var/lib/containerd &>/dev/null || break
      umount /var/lib/containerd 2>/dev/null || umount -l /var/lib/containerd 2>/dev/null || break
      sleep 1
    done
  changed_when: false
  become: true
  when: containerd_existing_binding.stdout | trim != 'selected'

- name: Find an existing mountpoint for the selected storage device
  ansible.builtin.shell: |
    findmnt -nr -S /dev/{{ storage }} -o TARGET 2>/dev/null | head -n 1 || true
  register: storage_existing_mount
  changed_when: false
  become: true

- name: Read the selected storage filesystem type
  ansible.builtin.command:
    argv:
      - blkid
      - -s
      - TYPE
      - -o
      - value
      - "/dev/{{ storage }}"
  register: storage_fstype
  changed_when: false
  failed_when: false
  become: true

- name: Require a supported selected storage filesystem
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (containerd_existing_binding.stdout | trim == 'selected' and
         storage_fstype.stdout | trim in ['ext4', 'xfs', 'btrfs']) or
        (containerd_existing_binding.stdout | trim != 'selected' and
         storage_existing_mount.stdout | trim | length > 0 and
         storage_fstype.stdout | trim in ['ext4', 'xfs', 'btrfs']) or
        (containerd_existing_binding.stdout | trim != 'selected' and
         storage_existing_mount.stdout | trim | length == 0 and
         storage_fstype.stdout | trim == 'ext4')
    fail_msg: >-
      Selected storage /dev/{{ storage }} uses '{{ storage_fstype.stdout | trim }}'.
      Mounted storage must use ext4/xfs/btrfs; unmounted storage must already be
      ext4. SynthRAN will not format the device.

- name: Create the containerd directory on already-mounted storage
  ansible.builtin.file:
    path: "{{ storage_existing_mount.stdout | trim }}/containerd"
    state: directory
    mode: '0755'
  become: true
  when:
    - containerd_existing_binding.stdout | trim != 'selected'
    - storage_existing_mount.stdout | trim | length > 0

- name: Bind already-mounted storage to the containerd data directory
  ansible.builtin.shell: |
    mount --bind "{{ storage_existing_mount.stdout | trim }}/containerd" /var/lib/containerd
  become: true
  when:
    - containerd_existing_binding.stdout | trim != 'selected'
    - storage_existing_mount.stdout | trim | length > 0

- name: Mount unmounted ext4 storage at the containerd data directory
  ansible.builtin.shell: |
    mount -t ext4 -o defaults,noatime /dev/{{ storage }} /var/lib/containerd
  become: true
  when:
    - containerd_existing_binding.stdout | trim != 'selected'
    - storage_existing_mount.stdout | trim | length == 0

- name: Verify containerd storage is on a real filesystem
  ansible.builtin.shell: |
    fstype=$(findmnt -n -o FSTYPE /var/lib/containerd 2>/dev/null | head -1 || echo "NOT_MOUNTED")
    echo "$fstype"
    case "$fstype" in
      ext4|xfs|btrfs) exit 0 ;;
      *) exit 1 ;;
    esac
  register: containerd_storage_fstype
  changed_when: false
  become: true

- name: Report the selected containerd storage binding
  ansible.builtin.debug:
    msg: >-
      /dev/{{ storage }} ({{ storage_fstype.stdout | trim }}) ->
      {{ 'retained /var/lib/containerd' if containerd_existing_binding.stdout | trim == 'selected' else (storage_existing_mount.stdout | trim if storage_existing_mount.stdout | trim | length > 0 else '/var/lib/containerd') }} ->
      /var/lib/containerd ({{ containerd_storage_fstype.stdout | trim }})

- name: Ensure kubelet base directory exists
  ansible.builtin.file:
    path: /var/lib/kubelet
    state: directory
    mode: '0755'
  become: true

- name: Mount tmpfs on /var/lib/kubelet for a colocated live 5G node
  ansible.builtin.mount:
    path: /var/lib/kubelet
    src: tmpfs
    fstype: tmpfs
    opts: size=5G
    state: mounted
  become: true
  when:
    - live_image_check.stdout == "live"
    - ran_node_name == core_node_name

- name: Restart containerd after changing its storage binding
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true
  become: true
  when: containerd_existing_binding.stdout | trim != 'selected'

- name: Keep containerd running on the retained storage binding
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
  become: true
  when: containerd_existing_binding.stdout | trim == 'selected'

- name: Wait for containerd to accept requests
  ansible.builtin.command: ctr version
  register: pre_k8s_containerd_ready
  changed_when: false
  retries: 30
  delay: 1
  until: pre_k8s_containerd_ready.rc == 0
