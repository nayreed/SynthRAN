---
- name: Ensure OVS is installed
  ansible.builtin.apt:
    name: openvswitch-switch
    state: present
    update_cache: true
  become: true

- name: Ensure OVS services are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - ovsdb-server
    - ovs-vswitchd
  become: true

- name: Require the selected transport bridge contract
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_topology.transport is mapping
      - synthran_topology.transport.bridges is mapping
      - synthran_topology.transport.bridges.core is iterable
      - synthran_topology.transport.bridges.ran is iterable
    fail_msg: The selected topology does not define the authoritative OVS bridge contract.

- name: Select authoritative OVS bridges for this host
  ansible.builtin.set_fact:
    ovs_bridges: >-
      {{
        ((synthran_topology.transport.bridges.core
          if inventory_hostname in groups['core_node'] else [])
         +
         (synthran_topology.transport.bridges.ran
          if inventory_hostname in groups['ran_node'] else []))
        | unique | list
      }}

- name: Create authoritative OVS bridges
  ansible.builtin.shell: |
    if ovs-vsctl br-exists {{ item }}; then
      echo existing
    else
      ovs-vsctl add-br {{ item }}
      echo created
    fi
  loop: "{{ ovs_bridges }}"
  register: ovs_bridge_create
  changed_when: ovs_bridge_create.stdout | trim == 'created'
  become: true

- name: Verify OVS daemons
  ansible.builtin.service_facts:

- name: Validate OVS service health
  ansible.builtin.assert:
    that:
      - services['ovsdb-server.service'].state == 'running'
      - services['ovs-vswitchd.service'].state == 'running'
    fail_msg: "One or more Open vSwitch services are not running on {{ inventory_hostname }}"
    success_msg: Open vSwitch services are running

- name: Verify authoritative OVS bridges
  ansible.builtin.command: "ovs-vsctl br-exists {{ item }}"
  loop: "{{ ovs_bridges }}"
  become: true
  changed_when: false
