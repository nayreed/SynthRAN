---
- name: Resolve peer underlay for {{ synthran_gre_bridge }}
  ansible.builtin.set_fact:
    synthran_transport_remote_ip: >-
      {{ hostvars[groups['ran_node'][0]].ip
         if inventory_hostname in groups['core_node']
         else hostvars[groups['core_node'][0]].ip }}

- name: Converge unkeyed GRE link for {{ synthran_gre_bridge }}
  ansible.builtin.shell: |
    set -eu
    bridge={{ synthran_gre_bridge | quote }}
    remote={{ synthran_transport_remote_ip | quote }}
    port="gre-${bridge}"
    current_bridge="$(ovs-vsctl port-to-br "$port" 2>/dev/null || true)"
    current_type="$(ovs-vsctl --if-exists get interface "$port" type 2>/dev/null | tr -d '"' || true)"
    current_remote="$(ovs-vsctl --if-exists get interface "$port" options:remote_ip 2>/dev/null | tr -d '"' || true)"
    current_options="$(ovs-vsctl --if-exists get interface "$port" options 2>/dev/null || true)"
    if [ "$current_bridge" = "$bridge" ] && \
       [ "$current_type" = "gre" ] && \
       [ "$current_remote" = "$remote" ] && \
       ! printf '%s' "$current_options" | grep -q 'key='; then
      echo retained
      exit 0
    fi
    ovs-vsctl --may-exist add-port "$bridge" "$port"
    ovs-vsctl set interface "$port" type=gre
    ovs-vsctl clear interface "$port" options
    ovs-vsctl set interface "$port" options:remote_ip="$remote"
    echo changed
  args:
    executable: /bin/bash
  register: synthran_gre_converge
  changed_when: synthran_gre_converge.stdout | trim == 'changed'
  become: true

- name: Verify GRE peer for {{ synthran_gre_bridge }}
  ansible.builtin.command:
    argv:
      - ovs-vsctl
      - get
      - interface
      - "gre-{{ synthran_gre_bridge }}"
      - options
  register: synthran_gre_options
  changed_when: false
  become: true

- name: Require the selected GRE peer and no keyed fork for {{ synthran_gre_bridge }}
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_transport_remote_ip in synthran_gre_options.stdout
      - "'key=' not in synthran_gre_options.stdout"
    fail_msg: >-
      GRE {{ synthran_gre_bridge }} does not match the selected unkeyed
      topology contract for peer {{ synthran_transport_remote_ip }}.
