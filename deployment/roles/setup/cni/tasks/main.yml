---
- name: Force Ansible to use venv Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python

# Host bridge lifecycle belongs to setup/ovs and the selected topology contract.
# CNAO exposes OVS-CNI independently of inter-host GRE placement: colocated
# Open5GS uses pinned OVS NADs, and OAI+UERANSIM retains an OVS compatibility
# attachment even though neither case needs a GRE tunnel.
- name: Render the shared NetworkAddonsConfig manifest
  ansible.builtin.template:
    src: network-addons-config.yaml.j2
    dest: /tmp/network-addons-config.yaml

- name: Apply Cluster-Network-Addons Operator manifests
  ansible.builtin.shell: |
    kubectl apply -f {{ item }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop:
    - "https://github.com/kubevirt/cluster-network-addons-operator/releases/download/{{ cnao_version }}/namespace.yaml"
    - "https://github.com/kubevirt/cluster-network-addons-operator/releases/download/{{ cnao_version }}/network-addons-config.crd.yaml"
    - "https://github.com/kubevirt/cluster-network-addons-operator/releases/download/{{ cnao_version }}/operator.yaml"
  become: true

- name: Wait for cluster-network-addons namespace to exist
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: cluster-network-addons
    kubeconfig: /etc/kubernetes/admin.conf
  register: cnano_ns
  retries: 15
  delay: 5
  until: cnano_ns.resources | length > 0
  changed_when: false

- name: Force CNAO Operator deployment onto core_node
  kubernetes.core.k8s:
    kind: Deployment
    namespace: cluster-network-addons
    name: cluster-network-addons-operator
    merge_type: strategic-merge
    definition:
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: "{{ inventory_hostname }}"
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
    kubeconfig: /etc/kubernetes/admin.conf
  become: true

- name: Wait for cluster-network-addons-operator to be ready
  ansible.builtin.shell: |
    kubectl -n cluster-network-addons rollout status deployment/cluster-network-addons-operator --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cnao_operator_wait
  retries: 5
  delay: 10
  until: cnao_operator_wait.rc == 0
  changed_when: false

- name: Apply NetworkAddonsConfig from /tmp
  kubernetes.core.k8s:
    state: present
    src: /tmp/network-addons-config.yaml
    kubeconfig: /etc/kubernetes/admin.conf
  changed_when: false

- name: Wait for NetworkAddonsConfig to reach Available condition
  ansible.builtin.shell: |
    set -e
    for i in $(seq 1 60); do
      phase=$(kubectl -n cluster-network-addons get networkaddonsconfig cluster -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "Unknown")
      echo "⏳ Waiting for NetworkAddonsConfig to be Available (attempt $i): $phase"
      if [ "$phase" = "True" ]; then
        echo "✅ NetworkAddonsConfig is Available"
        exit 0
      fi
      sleep 10
    done
    echo "❌ NetworkAddonsConfig did not become Available in time"
    exit 1
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cnao_available
  retries: 3
  delay: 5
  until: cnao_available.rc == 0
  changed_when: false

- name: Retain the Kubernetes-enabled Ansible Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
