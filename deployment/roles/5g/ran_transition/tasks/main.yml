---
- name: Normalize the selected physical RAN transition
  ansible.builtin.set_fact:
    synthran_ran_transition_selected: "{{ ran | string | trim | lower }}"
    synthran_ran_transition_namespace: "{{ core | string | trim }}"
    synthran_ran_transition_radio: "{{ rru | string | trim | lower }}"

- name: Require the shared transition to stay inside its physical ownership boundary
  ansible.builtin.assert:
    quiet: true
    that:
      - (platform | string | trim | lower) == 'r2lab'
      - synthran_ran_transition_radio in ['n300', 'n320']
      - synthran_ran_transition_selected in ['oai', 'srsran']
      - synthran_ran_transition_namespace | length > 0
      - ran_node_name is defined
      - ran_node_name | string | trim | length > 0
      - helm_version is defined
      - helm_version | string | trim | length > 0
    fail_msg: >-
      The shared RAN transition is only valid for physical R2Lab N300/N320
      OAI<->srsRAN switching with an explicit namespace, RAN node and pinned Helm.

- name: Select the non-selected implementation
  ansible.builtin.set_fact:
    synthran_ran_transition_incompatible: >-
      {{ 'srsran' if synthran_ran_transition_selected == 'oai' else 'oai' }}

- name: Resolve only the known incompatible RAN resources
  ansible.builtin.set_fact:
    synthran_ran_transition_targets: >-
      {{ synthran_ran_transition_catalog[synthran_ran_transition_incompatible] }}

- name: Prove the selected implementation is never a cleanup target
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_ran_transition_selected != synthran_ran_transition_incompatible
      - synthran_ran_transition_targets | length > 0
    fail_msg: >-
      The RAN transition catalog selected an invalid or self-targeting cleanup set.

- name: Verify the centrally pinned Helm runtime before transition
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: synthran_ran_transition_helm_version
  changed_when: false

- name: Refuse an unexpected Helm runtime at the transition boundary
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in synthran_ran_transition_helm_version.stdout"
    fail_msg: >-
      Cross-RAN transition requires the checksum-pinned Helm v{{ helm_version }}
      runtime already established by SynthRAN.

- name: Require the selected workload namespace to exist
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - namespace
      - "{{ synthran_ran_transition_namespace }}"
      - --output
      - name
  changed_when: false

- name: Discover exact incompatible RAN pods on the selected RAN node
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --all-namespaces
      - --field-selector
      - "spec.nodeName={{ ran_node_name }}"
      - --selector
      - "{{ item.pod_selector }}"
      - --output
      - "custom-columns=NS:.metadata.namespace"
      - --no-headers
  loop: "{{ synthran_ran_transition_targets }}"
  loop_control:
    label: "{{ item.pod_selector }}"
  register: synthran_ran_transition_node_pods
  changed_when: false

- name: Seed bounded transition namespaces with the selected workload namespace
  ansible.builtin.set_fact:
    synthran_ran_transition_candidate_namespaces:
      - "{{ synthran_ran_transition_namespace }}"

- name: Add an old namespace only when an exact incompatible pod is live on the selected RAN node
  ansible.builtin.set_fact:
    synthran_ran_transition_candidate_namespaces: >-
      {{ synthran_ran_transition_candidate_namespaces + [item.1] }}
  loop: >-
    {{ query(
         'subelements',
         synthran_ran_transition_node_pods.results,
         'stdout_lines',
         {'skip_missing': true}
       ) }}
  loop_control:
    label: "{{ item.1 }}/{{ item.0.item.release }}"
  when:
    - item.1 | string | trim | length > 0
    - item.1 not in synthran_ran_transition_candidate_namespaces

- name: Expand each proven stale namespace to the complete non-selected RAN family
  ansible.builtin.set_fact:
    synthran_ran_transition_candidates: >-
      {{ (synthran_ran_transition_candidates | default([])) + [
           item.0 | combine({'namespace': item.1})
         ] }}
  loop: >-
    {{ synthran_ran_transition_targets
       | product(synthran_ran_transition_candidate_namespaces)
       | list }}
  loop_control:
    label: "{{ item.1 }}/{{ item.0.release }}"

- name: Inspect incompatible Helm ownership for each bounded candidate
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ item.release }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - json
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.release }}"
  register: synthran_ran_transition_helm_before
  changed_when: false
  failed_when: false

- name: Inspect incompatible Deployment ownership for each bounded candidate
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - deployment
      - "{{ item.deployment }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.deployment }}"
  register: synthran_ran_transition_deployments_before
  changed_when: false
  failed_when: false

- name: Inspect incompatible pods for each bounded candidate
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace
      - "{{ item.namespace }}"
      - --selector
      - "{{ item.pod_selector }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.pod_selector }}"
  register: synthran_ran_transition_pods_before
  changed_when: false

- name: Inspect incompatible RU attachment definitions for each bounded candidate
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - network-attachment-definitions.k8s.cni.cncf.io
      - "{{ item.ru_nad }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.ru_nad | default('no-ru-nad', true) }}"
  register: synthran_ran_transition_nads_before
  changed_when: false
  failed_when: false
  when: item.ru_nad | length > 0

- name: Remove active incompatible Helm releases
  ansible.builtin.command:
    argv:
      - helm
      - uninstall
      - "{{ item.item.release }}"
      - --namespace
      - "{{ item.item.namespace }}"
      - --cascade
      - foreground
      - --wait
      - --timeout
      - "{{ synthran_ran_transition_timeout }}"
      - --no-hooks
  loop: "{{ synthran_ran_transition_helm_before.results }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.release }}"
  when:
    - item.rc == 0
    - (((item.stdout | default('{}', true)) | from_json).get('info', {}).get('status', '') | lower) != 'uninstalled'
  register: synthran_ran_transition_uninstalls
  changed_when: true

- name: Remove a known orphaned incompatible Deployment after Helm cleanup
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - deployment
      - "{{ item.item.deployment }}"
      - --namespace
      - "{{ item.item.namespace }}"
      - --ignore-not-found=true
      - --cascade=foreground
      - --wait=true
      - "--timeout={{ synthran_ran_transition_timeout }}"
  loop: "{{ synthran_ran_transition_deployments_before.results }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.deployment }}"
  when: item.rc == 0

- name: Remove any known orphaned incompatible pods and wait for CNI teardown
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - pods
      - --namespace
      - "{{ item.item.namespace }}"
      - --selector
      - "{{ item.item.pod_selector }}"
      - --ignore-not-found=true
      - --wait=true
      - "--timeout={{ synthran_ran_transition_timeout }}"
  loop: "{{ synthran_ran_transition_pods_before.results }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.pod_selector }}"
  when: item.stdout_lines | length > 0

- name: Recheck incompatible pods before releasing RU attachment definitions
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace
      - "{{ item.namespace }}"
      - --selector
      - "{{ item.pod_selector }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.pod_selector }}"
  register: synthran_ran_transition_pods_before_nad_delete
  changed_when: false

- name: Refuse RU-NAD deletion while an incompatible pod remains
  ansible.builtin.assert:
    quiet: true
    that:
      - item.stdout_lines | length == 0
    fail_msg: >-
      Incompatible RAN pods still exist in {{ item.item.namespace }} for
      {{ item.item.pod_selector }}; refusing to release the RU NAD before
      pod/CNI teardown is complete.
  loop: "{{ synthran_ran_transition_pods_before_nad_delete.results }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.pod_selector }}"

- name: Remove an incompatible RU NAD only after pod and CNI teardown
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - network-attachment-definitions.k8s.cni.cncf.io
      - "{{ item.item.ru_nad }}"
      - --namespace
      - "{{ item.item.namespace }}"
      - --ignore-not-found=true
      - --wait=true
      - "--timeout={{ synthran_ran_transition_timeout }}"
  loop: "{{ synthran_ran_transition_nads_before.results }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.ru_nad | default('no-ru-nad', true) }}"
  when:
    - item.item.ru_nad | length > 0
    - item.rc == 0

- name: Reinspect Helm ownership after transition
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ item.release }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - json
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.release }}"
  register: synthran_ran_transition_helm_after
  changed_when: false
  failed_when: false

- name: Reinspect Deployments after transition
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - deployment
      - "{{ item.deployment }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.deployment }}"
  register: synthran_ran_transition_deployments_after
  changed_when: false
  failed_when: false

- name: Reinspect pods after transition
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace
      - "{{ item.namespace }}"
      - --selector
      - "{{ item.pod_selector }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.pod_selector }}"
  register: synthran_ran_transition_pods_after
  changed_when: false

- name: Reinspect RU attachment definitions after transition
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - network-attachment-definitions.k8s.cni.cncf.io
      - "{{ item.ru_nad }}"
      - --namespace
      - "{{ item.namespace }}"
      - --output
      - name
  loop: "{{ synthran_ran_transition_candidates }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.ru_nad | default('no-ru-nad', true) }}"
  register: synthran_ran_transition_nads_after
  changed_when: false
  failed_when: false
  when: item.ru_nad | length > 0

- name: Prove exclusive pre-launch ownership for the selected RAN
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        synthran_ran_transition_helm_after.results
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'defined')
        | map(attribute='stdout')
        | map('from_json')
        | map(attribute='info.status')
        | map('lower')
        | reject('equalto', 'uninstalled')
        | list | length == 0
      - >-
        synthran_ran_transition_deployments_after.results
        | selectattr('rc', 'equalto', 0)
        | list | length == 0
      - >-
        synthran_ran_transition_pods_after.results
        | map(attribute='stdout_lines')
        | flatten | list | length == 0
      - >-
        synthran_ran_transition_nads_after.results
        | rejectattr('skipped', 'defined')
        | selectattr('rc', 'equalto', 0)
        | list | length == 0
    fail_msg: >-
      Cross-RAN transition did not reach an exclusive pre-launch state for
      selected RAN node {{ ran_node_name }}.

- name: Ensure the run provenance directory exists for transition evidence
  ansible.builtin.file:
    path: "{{ run_dir }}/provenance"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Retain cross-RAN transition evidence
  ansible.builtin.copy:
    dest: "{{ run_dir }}/provenance/ran-transition.json"
    mode: '0644'
    content: >-
      {{ {
           'schema_version': 3,
           'selected_ran': synthran_ran_transition_selected,
           'incompatible_ran': synthran_ran_transition_incompatible,
           'selected_ran_node': ran_node_name,
           'selected_namespace': synthran_ran_transition_namespace,
           'radio': synthran_ran_transition_radio,
           'host_preparation': synthran_host_preparation | default('unknown'),
           'bounded_candidates': synthran_ran_transition_candidates,
           'node_discovery': (
             synthran_ran_transition_node_pods.results
             | map(attribute='stdout_lines') | list
           ),
           'exclusive_prelaunch': true
         } | to_nice_json }}
  delegate_to: localhost
  become: false
