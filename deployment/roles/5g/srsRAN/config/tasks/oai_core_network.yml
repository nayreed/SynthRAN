---
- name: Configure the OAI-backed N3 attachment without a fixed IPAM address
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ n3networkName }}"
        namespace: "{{ ran_ns }}"
      spec:
        config: "{{ {'cniVersion': '0.3.1', 'name': n3networkName, 'type': 'ovs', 'bridge': synthran_topology.transport.workload_interfaces.ran.n3, 'ipam': {'type': 'static'}} | to_json }}"
