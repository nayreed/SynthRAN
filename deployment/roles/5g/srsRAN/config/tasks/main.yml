---

- name: Check if ansible venv python exists
  ansible.builtin.stat:
    path: /opt/ansible-venv/bin/python
  register: venv_python

- name: Use the shared Kubernetes-enabled Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
  when: venv_python.stat.exists

- name: Load common variables
  ansible.builtin.include_vars:
    file: "../../common/defaults/main.yml"

- name: Remove existing srsRAN Helm directory to ensure clean state
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    state: absent

- name: Clone repo srsRAN
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ version | default('main') }}"
    update: false
    force: true

- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ran_ns }}"
    state: present

- name: Gather env facts (remote)
  ansible.builtin.setup:
    filter: ansible_env
  when: ansible_env is not defined

- name: Normalize repo_dest to remote HOME
  ansible.builtin.set_fact:
    repo_dest_abs: "{{ (repo_dest | default('~/srsran-helm') | trim)
                       | regex_replace('^~/?', ansible_env.HOME ~ '/') }}"

- name: Require a supported srsRAN radio mode
  ansible.builtin.assert:
    quiet: true
    that:
      - (rru | string | trim | lower) in ['rfsim', 'n300', 'n320']
    fail_msg: "srsRAN supports only rfsim, n300, or n320 in SynthRAN"

- name: Select values filename from rru
  ansible.builtin.set_fact:
    values_filename: "{{ rru_file_map[(rru | string | trim | lower)] }}"
  vars:
    rru_file_map:
      n300: values-n300-n78-20MHz.yaml
      n320: values-n320-n78-20MHz.yaml
      rfsim: values-rfsim.yaml

- name: Build absolute values_file path
  ansible.builtin.set_fact:
    values_file: "{{ [repo_dest_abs, 'charts', 'srsran-gnb', values_filename] | path_join }}"

- name: Report the srsRAN configuration paths
  ansible.builtin.debug:
    msg:
      - "repo_dest_abs='{{ repo_dest_abs }}'"
      - "values_file='{{ values_file }}'"

- name: Ensure values file exists (remote)
  ansible.builtin.stat:
    path: "{{ values_file }}"
  register: values_stat

- name: Fail if values file missing
  ansible.builtin.fail:
    msg: "Values file not found: {{ values_file }}"
  when: not values_stat.stat.exists

- name: Patch n3 NAD MTU for free5gc split-node scenario
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ n3networkName }}"
        namespace: "{{ ran_ns }}"
      spec:
        config: >-
          { "cniVersion": "0.3.1", "plugins": [ { "type": "ovs",
            "capabilities": { "ips": true },
            "bridge": "{{ synthran_topology.transport.workload_interfaces.ran.n3 }}",
            "mtu": 1450,
            "ipam": { "type": "static", "routes": [ { "dst": "0.0.0.0/0", "gw": "" } ] }
          } ] }
  when:
    - core == 'free5gc'
    - core_node_name != ran_node_name

- name: Apply network profile to gNB and UE configs
  ansible.builtin.include_tasks: apply_network_profile.yaml

- name: Report the srsRAN AMF endpoint
  ansible.builtin.debug:
    msg:
      - "amf_ip={{ srsran_network.n2.amf_ip | quote }}"
      - "amf_port={{ srsran_network.n2.amf_port | quote }}"

- name: Update AMF address, gNB N3 IP, namespace and n3networkName
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cu_cp.amf.addr = "{{ srsran_network.n2.amf_ip }}" |
      .gnbConfig.cu_cp.amf.port = {{ srsran_network.n2.amf_port }} |
      .gnbConfig.cu_cp.amf.bind_addr = "{{ srsran_network.n2.gnb_bind_ip }}" |
      .gnbConfig.cu_up.ngu.socket = [{"bind_addr": "{{ srsran_network.n3.gnb_ip }}"}] |
      .gnbIp = "{{ srsran_network.n3.gnb_ip }}" |
      .n3networkName = "{{ n3networkName }}" |
      .namespace = "{{ ran_ns }}"
    ' "{{ values_file }}"

- name: Fix device_args for RFSIM GNU Radio single-channel multi-UE
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cell_cfg.channel_bandwidth_MHz = 20 |
      .gnbConfig.cell_cfg.pdcch.common.coreset0_index = 12 |
      .gnbConfig.cell_cfg.pdcch.common.ss0_index = 0 |
      .gnbConfig.ru_sdr.srate = 23.04 |
      .gnbConfig.ru_sdr.device_args = "tx_port=tcp://{{ srsran_network.n3.gnb_ip }}:2000,rx_port=tcp://{{ srsran_network.n3.ue_ips[0] }}:2001,base_srate=23.04e6"
    ' "{{ values_file }}"
  when: rru == 'rfsim'

- name: Configure srsRAN interoperability with an OAI core
  ansible.builtin.include_tasks: oai_core_network.yml
  when: core == 'oai'

- name: Load resolved network profile vars for RFSIM UE rendering
  ansible.builtin.include_vars:
    file: "{{ network_profile_file }}"
    name: fiveg
  when: rru == 'rfsim'

- name: Require one sequential deployment-contract entry per selected RFSIM UE
  ansible.builtin.assert:
    quiet: true
    that:
      - (ue_count | int) > 0
      - synthran_ue_map | length == (ue_count | int)
      - >-
        (synthran_ue_map | map(attribute='index') | map('int') | list) ==
        (range(1, (ue_count | int) + 1) | list)
      - >-
        (synthran_ue_map | map(attribute='device') | list | unique | list | length) ==
        (ue_count | int)
    fail_msg: >-
      RFSIM requires a non-empty, unique and sequential selected-UE map that
      exactly matches ue_count.
  when: rru == 'rfsim'

- name: Validate every selected software UE against the effective network profile
  ansible.builtin.assert:
    quiet: true
    that:
      - item.device in fiveg.ues
      - (fiveg.ues[item.device].imsi_suffix | string) is match('^[0-9]{10}$')
      - fiveg.ues[item.device].slice in fiveg.slices | map(attribute='name') | list
      - 2101 + ((item.index | int) - 1) * 100 <= 65535
    fail_msg: "Invalid RFSIM UE definition for {{ item.device }} at index {{ item.index }}"
  loop: "{{ synthran_ue_map }}"
  loop_control:
    label: "{{ item.device }}"
  when: rru == 'rfsim'

- name: Initialize the selected srsUE list
  ansible.builtin.set_fact:
    ue_list: []
  when: rru == 'rfsim'

- name: Build one srsUE definition per configured device
  ansible.builtin.set_fact:
    ue_list: "{{ ue_list + [ue_definition] }}"
  vars:
    ue_profile: "{{ fiveg.ues[item.device] }}"
    ue_slice: "{{ fiveg.slices | selectattr('name', 'equalto', ue_profile.slice) | first }}"
    ue_definition:
      name: "{{ item.device }}"
      index: "{{ item.index | int }}"
      imsi: "{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ ue_profile.imsi_suffix }}"
      dnn: "{{ ue_slice.dnn }}"
      sst: "{{ ue_slice.sst | int }}"
      sd: >-
        {{ ''
           if (ue_slice.sd | string | upper) == 'EMPTY'
           else (ue_slice.sd | string | regex_replace('^0[xX]', '') | int(base=16)) }}
      tx_port: "{{ 2101 + ((item.index | int) - 1) * 100 }}"
      rx_port: "{{ 2100 + ((item.index | int) - 1) * 100 }}"
      ue_ip: "{{ srsran_network.n3.ue_ips[0] }}"
  loop: "{{ synthran_ue_map }}"
  loop_control:
    label: "{{ item.device }}"
  when: rru == 'rfsim'

- name: Read the pinned srsUE image coordinates
  ansible.builtin.command:
    argv:
      - "{{ yq_bin_path }}"
      - eval
      - -o=json
      - '{"repository": .image.repository, "tag": .image.tag, "pull_policy": .image.pullPolicy}'
      - "{{ [repo_dest_abs, 'charts', 'srsue', 'values.yaml'] | path_join }}"
  register: synthran_srsue_image_source_json
  changed_when: false
  when: rru == 'rfsim'

- name: Decode the pinned srsUE image coordinates
  ansible.builtin.set_fact:
    synthran_srsue_image_source: "{{ synthran_srsue_image_source_json.stdout | from_json }}"
  when: rru == 'rfsim'

- name: Validate the pinned srsUE image coordinates
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsue_image_source.repository | default('') | length > 0
      - >-
        ('@sha256:' in synthran_srsue_image_source.repository) or
        (synthran_srsue_image_source.tag | default('') | length > 0)
      - synthran_srsue_image_source.pull_policy | default('') | length > 0
    fail_msg: The pinned srsUE chart does not identify a resolvable container image.
  when: rru == 'rfsim'

- name: Reuse an already immutable srsUE image reference
  ansible.builtin.set_fact:
    synthran_srsue_image_reference: "{{ synthran_srsue_image_source.repository }}"
  when:
    - rru == 'rfsim'
    - "'@sha256:' in synthran_srsue_image_source.repository"

- name: Resolve the pinned public srsUE image to an immutable digest
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - synthran.image_digest
      - --repository
      - "{{ synthran_srsue_image_source.repository }}"
      - --tag
      - "{{ synthran_srsue_image_source.tag }}"
  delegate_to: localhost
  become: false
  register: synthran_srsue_image_resolution
  changed_when: false
  when:
    - rru == 'rfsim'
    - "'@sha256:' not in synthran_srsue_image_source.repository"

- name: Freeze the resolved srsUE image reference
  ansible.builtin.set_fact:
    synthran_srsue_image_reference: "{{ synthran_srsue_image_resolution.stdout | trim }}"
  when:
    - rru == 'rfsim'
    - synthran_srsue_image_resolution is defined
    - not (synthran_srsue_image_resolution.skipped | default(false) | bool)

- name: Require an immutable srsUE image before values rendering
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsue_image_reference is match('^[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$')
    fail_msg: RFSIM srsUE must resolve to an immutable sha256 image reference.
  when: rru == 'rfsim'

- name: Write srsue values-rfsim.yaml
  ansible.builtin.copy:
    dest: "{{ [repo_dest_abs, 'charts', 'srsue', 'values-rfsim.yaml'] | path_join }}"
    content: |
      image:
        repository: "{{ synthran_srsue_image_reference }}"
        tag: ""
        pullPolicy: "{{ synthran_srsue_image_source.pull_policy }}"
      gnbIp: "{{ srsran_network.n3.gnb_ip }}"
      ueIp: "{{ srsran_network.n3.ue_ips[0] }}"
      n3networkName: "{{ n3networkName }}"
      nodeName: "{{ ran_node_name }}"
      nodeSelector:
        kubernetes.io/hostname: "{{ ran_node_name }}"
      ueCount: {{ ue_count }}
      ues:
      {% for ue in ue_list %}
        - imsi: "{{ ue.imsi }}"
          k: "{{ fiveg.security.full_key }}"
          opc: "{{ fiveg.security.opc }}"
          apn: "{{ ue.dnn }}"
          sst: "{{ ue.sst }}"
          sd: "{{ ue.sd }}"
          ueIp: "{{ ue.ue_ip }}"
          zmqTxPort: {{ ue.tx_port }}
          zmqRxPort: {{ ue.rx_port }}
      {% endfor %}
  when: rru == 'rfsim'

- name: Prepare the RFSIM chart from the selected UE contract
  ansible.builtin.include_tasks: prepare_rfsim_chart.yml
  when: rru == 'rfsim'

- name: Freeze and validate the final srsRAN runtime chart
  ansible.builtin.include_tasks: harden_runtime.yml

- name: Retain the Kubernetes-enabled Ansible Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
  when: venv_python.stat.exists
