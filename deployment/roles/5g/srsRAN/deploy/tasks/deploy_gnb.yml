---
- name: Require the centrally verified Helm runtime
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: helm_check
  changed_when: false

- name: Refuse an unexpected Helm runtime
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in helm_check.stdout"
    fail_msg: "srsRAN requires the checksum-pinned Helm v{{ helm_version }} runtime"

- name: Load common variables
  ansible.builtin.include_vars:
    file: "../../common/defaults/main.yml"

- name: Check srsran-gnb release
  ansible.builtin.command: helm status srsran-gnb -n {{ ran_ns }}
  register: gnb_release_exists
  changed_when: false
  failed_when: false

- name: Uninstall srsran-gnb
  ansible.builtin.command: helm uninstall srsran-gnb -n {{ ran_ns }} --no-hooks
  when: gnb_release_exists.rc == 0

- name: Deploy physical srsRAN through the pinned lifecycle owner
  when: rru in ['n300', 'n320']
  block:
    - name: Initialize the reference-owned physical retry contract
      ansible.builtin.set_fact:
        gnb_startup_success: false
        max_attempts: 2

    - name: Run the exact pinned physical startup task
      ansible.builtin.include_tasks: "{{ synthran_srsran_reference_deploy_with_check }}"
      loop: "{{ range(1, max_attempts + 1) | list }}"
      when: not gnb_startup_success

    - name: Require reference-owned physical startup success
      ansible.builtin.assert:
        quiet: true
        that:
          - gnb_startup_success | bool
        fail_msg: >-
          Physical srsRAN gNB did not remain radio-ready after the pinned
          5g-Ansible lifecycle exhausted its supported attempts.

- name: Deploy RFSIM srsRAN gNB through the generic Helm path
  when: rru == 'rfsim'
  kubernetes.core.helm:
    name: srsran-gnb
    chart_ref: "{{ [repo_dest_abs, 'charts', 'srsran-gnb'] | path_join }}"
    release_namespace: "{{ ran_ns }}"
    values_files:
      - "{{ values_file }}"
    state: present
    wait: false
    atomic: true
    timeout: 180s
