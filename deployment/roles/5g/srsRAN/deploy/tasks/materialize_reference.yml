---
- name: Load the pinned 5g-Ansible execution reference
  ansible.builtin.set_fact:
    synthran_srsran_reference: >-
      {{ lookup(
           'ansible.builtin.file',
           synthran_execution_reference_file
           | default(synthran_root ~ '/third_party/sopnode-5g-ansible/EXECUTION_REFERENCE.json')
         ) | from_json }}
  when: synthran_srsran_reference is not defined

- name: Require an immutable srsRAN lifecycle reference
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsran_reference.repository == 'https://github.com/sopnode/5g_ansible'
      - synthran_srsran_reference.commit is match('^[0-9a-f]{40}$')
    fail_msg: >-
      Sub 07 requires the reviewed original sopnode/5g_ansible execution
      reference rather than an implicit, floating, or fork-owned lifecycle source.

- name: Materialize the authoritative pinned execution reference
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - synthran.reference_checkout
  register: synthran_srsran_reference_checkout
  changed_when: false
  delegate_to: localhost
  become: false

- name: Resolve the verified execution-reference root
  ansible.builtin.set_fact:
    synthran_srsran_reference_root: "{{ synthran_srsran_reference_checkout.stdout | trim }}"

- name: Read back the materialized lifecycle revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ synthran_srsran_reference_root }}"
      - rev-parse
      - HEAD
  register: synthran_srsran_reference_head
  changed_when: false
  delegate_to: localhost
  become: false

- name: Require the exact reviewed lifecycle revision
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsran_reference_root | length > 0
      - (synthran_srsran_reference_head.stdout | trim) == synthran_srsran_reference.commit
    fail_msg: >-
      The authoritative 5g-Ansible cache does not match the reviewed Sub 07
      execution reference.

- name: Resolve reference-owned srsRAN lifecycle tasks
  ansible.builtin.set_fact:
    synthran_srsran_reference_deploy_with_check: >-
      {{ synthran_srsran_reference_root }}/roles/5g/srsRAN/deploy/tasks/deploy_with_check.yml
    synthran_srsran_reference_deploy_srsues: >-
      {{ synthran_srsran_reference_root }}/roles/5g/srsRAN/deploy/tasks/deploy_srsues.yml

- name: Verify reference-owned srsRAN lifecycle tasks exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ synthran_srsran_reference_deploy_with_check }}"
    - "{{ synthran_srsran_reference_deploy_srsues }}"
  register: synthran_srsran_reference_tasks
  delegate_to: localhost
  become: false

- name: Refuse an incomplete lifecycle checkout
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsran_reference_tasks.results | length == 2
      - synthran_srsran_reference_tasks.results | map(attribute='stat.exists') | min
      - synthran_srsran_reference_tasks.results | map(attribute='stat.isreg') | min
    fail_msg: >-
      The pinned 5g-Ansible checkout does not contain all reviewed srsRAN
      lifecycle tasks required by Sub 07.
