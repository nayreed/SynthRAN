---
- name: Ensure Open5GS namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ open5gs_ns }}"
    state: present

- name: Apply MongoDB with the pinned Open5GS source
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -k
      - "{{ repo_dest }}/mongodb"
      - -n
      - "{{ open5gs_ns }}"
  changed_when: true

- name: Wait for MongoDB pod to be Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ open5gs_ns }}"
    label_selectors:
      - app.kubernetes.io/name=mongodb
  register: mongo_pods
  until: >-
    mongo_pods.resources | length > 0 and
    (mongo_pods.resources[0].status.containerStatuses is defined) and
    (mongo_pods.resources[0].status.containerStatuses | length > 0) and
    (mongo_pods.resources[0].status.containerStatuses | map(attribute='ready') | min)
  retries: 40
  delay: 10

- name: Require the Multus NetworkAttachmentDefinition API prepared by bootstrap
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - crd
      - network-attachment-definitions.k8s.cni.cncf.io
      - -o
      - name
  changed_when: false

- name: Apply Open5GS NetworkAttachmentDefinitions from the pinned source
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -k
      - "{{ repo_dest }}/networks5g"
      - -n
      - "{{ open5gs_ns }}"
  changed_when: true

- name: Verify required Open5GS NetworkAttachmentDefinitions
  kubernetes.core.k8s_info:
    kind: NetworkAttachmentDefinition
    namespace: "{{ open5gs_ns }}"
  register: nad_info

- name: Require every Open5GS NetworkAttachmentDefinition
  ansible.builtin.assert:
    quiet: true
    that:
      - item in (nad_info.resources | map(attribute='metadata.name') | list)
    fail_msg: "NAD {{ item }} is missing in {{ open5gs_ns }}"
  loop: "{{ nad_list }}"

- name: Verify topology-owned Open5GS bridges are present
  ansible.builtin.command:
    argv:
      - ovs-vsctl
      - br-exists
      - "{{ item }}"
  loop: "{{ synthran_topology.transport.bridges.core }}"
  changed_when: false
  when: bridge_enabled
  become: true

- name: Apply Open5GS network functions from the pinned source
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -k
      - "{{ repo_dest }}/{{ deployment_option }}"
      - -n
      - "{{ open5gs_ns }}"
  changed_when: true

- name: Wait for every Open5GS core network function to be Ready
  ansible.builtin.shell: |
    set -eu
    missing=""
    for nf in {{ nfs | join(' ') }}; do
      ready="$(
        kubectl get pods -n {{ open5gs_ns }} -l "nf=${nf}" \
          -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}'
      )"
      if [ -z "$ready" ] || printf '%s\n' "$ready" | grep -qvx True; then
        missing="${missing} ${nf}"
      fi
    done
    test -z "$missing" || { echo "Not Ready:${missing}"; exit 1; }
  args:
    executable: /bin/bash
  register: open5gs_nf_wait
  changed_when: false
  retries: 40
  delay: 5
  until: open5gs_nf_wait.rc == 0

- name: Verify the AMF NGAP endpoint on the topology-selected network
  ansible.builtin.shell: |
    set -eu
    AMF_POD="$(kubectl get pods -n {{ open5gs_ns }} -l nf=amf -o jsonpath='{.items[0].metadata.name}')"
    test -n "$AMF_POD"
    kubectl exec -n {{ open5gs_ns }} "$AMF_POD" -- ip addr show n3 | \
      grep -F "inet {{ synthran_topology.transport.endpoints.amf_ngap_ip }}"
  args:
    executable: /bin/bash
  register: amf_ngap_check
  until: amf_ngap_check.rc == 0
  retries: 15
  delay: 5
  changed_when: false

- name: Install Open5GS subscriber runtime on a fresh host
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - python3-setuptools
      - python3-wheel
    state: present
  become: true
  when: synthran_host_preparation == 'fresh'

- name: Create the Open5GS subscriber virtual environment on a fresh host
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ repo_dest }}/venv"
    creates: "{{ repo_dest }}/venv/bin/python"
  become: true
  when: synthran_host_preparation == 'fresh'

- name: Install pinned-source Open5GS subscriber requirements on a fresh host
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/pip"
      - install
      - -r
      - "{{ repo_dest }}/requirements.txt"
  become: true
  register: open5gs_requirements_install
  changed_when: >-
    'Successfully installed' in (open5gs_requirements_install.stdout | default('')) or
    'Successfully installed' in (open5gs_requirements_install.stderr | default(''))
  when: synthran_host_preparation == 'fresh'

- name: Require a prepared Open5GS subscriber runtime
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/python"
      - -c
      - "import pymongo, ruamel.yaml"
  changed_when: false

- name: Generate selected Open5GS subscriber records from the effective profile
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/python"
      - "{{ repo_dest }}/mongo-tools/generate-data-fiveg.py"
    chdir: "{{ repo_dest }}"
  changed_when: true
  no_log: true

- name: Remove every existing Open5GS subscriber before reconciliation
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/python"
      - "{{ repo_dest }}/mongo-tools/delete-subscribers.py"
    chdir: "{{ repo_dest }}"
  changed_when: true
  no_log: true

- name: Insert the complete selected Open5GS subscriber set
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/python"
      - "{{ repo_dest }}/mongo-tools/add-subscribers.py"
    chdir: "{{ repo_dest }}"
  changed_when: true
  no_log: true

- name: Read Open5GS subscriber identifiers
  ansible.builtin.command:
    argv:
      - "{{ repo_dest }}/venv/bin/python"
      - "{{ repo_dest }}/mongo-tools/list-subscribers.py"
    chdir: "{{ repo_dest }}"
  register: open5gs_subscriber_listing
  changed_when: false
  no_log: true

- name: Require every selected Open5GS subscriber in the database
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        item in ((open5gs_subscriber_listing.stdout | default('')) ~
                 (open5gs_subscriber_listing.stderr | default('')))
    fail_msg: >-
      A selected Open5GS subscriber was not found after database reconciliation.
  loop: "{{ fiveg.ues | list }}"
  loop_control:
    label: selected-subscriber
  no_log: true

- name: Reject any Open5GS subscriber outside the generated effective profile
  ansible.builtin.assert:
    quiet: true
    that:
      - "'Subscriber not found for IMSI' not in ((open5gs_subscriber_listing.stdout | default('')) ~ (open5gs_subscriber_listing.stderr | default('')) )"
    fail_msg: >-
      Open5GS MongoDB contains a subscriber that is not represented by the
      generated effective profile.
  no_log: true

- name: Provision the optional Open5GS WebUI and administrator account
  ansible.builtin.include_tasks: webui.yml
  when: open5gs_webui_enabled | bool

- name: Check Open5GS deployment details when explicitly requested
  ansible.builtin.include_role:
    name: 5g/open5gs/check_all
  when: show_open5gs_config | default(false)
