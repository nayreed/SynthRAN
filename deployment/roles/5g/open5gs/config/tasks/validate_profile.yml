---
- name: Validate Open5GS PLMN
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc is defined
      - fiveg.plmn.mnc is defined
      - fiveg.plmn.tac is defined

- name: Validate Open5GS slices
  ansible.builtin.assert:
    quiet: true
    that:
      - slice.name is defined
      - slice.sst is defined
      - slice.dnn is defined
      - slice.sd is defined
      - slice.ip_prefix is defined
  loop: "{{ fiveg.slices }}"
  loop_control:
    loop_var: slice
    label: "{{ slice.name }}"

- name: Require the two-slice Open5GS deployment layout
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.slices | length == 2
    fail_msg: >-
      The retained Open5GS Kubernetes layout exposes two SMF/UPF slots; the
      selected network profile must therefore define exactly two slices.

- name: Validate Open5GS UE slice references
  ansible.builtin.assert:
    quiet: true
    that:
      - ue.value.slice in fiveg.slices | map(attribute='name') | list
  loop: "{{ fiveg.ues | dict2items }}"
  loop_control:
    loop_var: ue
    label: "{{ ue.key }}"
