---
- name: Load common variables
  ansible.builtin.include_vars:
    file: "../config/defaults/main.yml"

- name: Ensure free5gc namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ core_ns }}"
    state: present

# ============================================================
# Step 1: Clean up any existing Helm release (including stuck)
# ============================================================

- name: Check if free5gc Helm release exists (including pending/failed states)
  ansible.builtin.shell: |
    set -o pipefail
    helm list -n "{{ core_ns }}" -a -q | \
      awk '$0 == "free5gc" { count++ } END { print count + 0 }'
  args:
    executable: /bin/bash
  register: helm_release_exists
  changed_when: false

- name: Uninstall existing free5gc Helm release (handles pending-install/upgrade/failed)
  ansible.builtin.shell: helm uninstall free5gc -n "{{ core_ns }}" --no-hooks --timeout 120s
  when: helm_release_exists.stdout | trim | int > 0
  failed_when: false
  register: helm_uninstall_result

- name: Wait for Helm release to be fully removed
  ansible.builtin.shell: |
    set -o pipefail
    helm list -n "{{ core_ns }}" -a -q | \
      awk '$0 == "free5gc" { count++ } END { print count + 0 }'
  args:
    executable: /bin/bash
  register: helm_gone
  until: helm_gone.stdout | trim | int == 0
  retries: 24
  delay: 5
  changed_when: false
  when: helm_release_exists.stdout | trim | int > 0

- name: Require the previous Free5GC Helm release to be absent
  ansible.builtin.assert:
    quiet: true
    that:
      - helm_gone.stdout | trim | int == 0
    fail_msg: >-
      The previous Free5GC Helm release could not be removed cleanly.
      {{ helm_uninstall_result.stderr | default('No uninstall diagnostics were available.') }}
  when: helm_release_exists.stdout | trim | int > 0

- name: Wait after Helm uninstall before cleaning resources
  ansible.builtin.pause:
    seconds: 10
  when: helm_release_exists.stdout | trim | int > 0

# ============================================================
# Step 2: Clean up static cert-pv
# ============================================================

- name: Delete static cert-pv if exists
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolume
    name: cert-pv
  failed_when: false

- name: Wait for cert-pv to be fully deleted
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pv
      - cert-pv
      - --ignore-not-found
      - -o
      - name
  register: pv_static_check
  until: pv_static_check.stdout | trim | length == 0
  retries: 20
  delay: 5
  changed_when: false

- name: Require the previous static cert-pv to be absent
  ansible.builtin.assert:
    quiet: true
    that:
      - pv_static_check.stdout | trim | length == 0
    fail_msg: "The previous Free5GC cert-pv could not be removed."

# ============================================================
# Step 3: Clean up cert-pvc and any dynamically bound PV
# ============================================================

- name: Check if cert-pvc exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: cert-pvc
    namespace: "{{ core_ns }}"
  register: cert_pvc_info

- name: Patch cert-pvc finalizers to unblock deletion
  ansible.builtin.shell: >
    kubectl patch pvc cert-pvc -n "{{ core_ns }}"
    -p '{"metadata":{"finalizers":null}}' --type=merge
  when: cert_pvc_info.resources | length > 0
  failed_when: false

- name: Delete cert-pvc
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: cert-pvc
    namespace: "{{ core_ns }}"
  when: cert_pvc_info.resources | length > 0
  failed_when: false

- name: Wait for cert-pvc to be fully deleted
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: cert-pvc
    namespace: "{{ core_ns }}"
  register: pvc_check
  until: pvc_check.resources | length == 0
  retries: 30
  delay: 5
  when: cert_pvc_info.resources | length > 0

- name: Require the previous cert-pvc to be absent
  ansible.builtin.assert:
    quiet: true
    that:
      - pvc_check.resources | length == 0
    fail_msg: "The previous Free5GC cert-pvc could not be removed."
  when: cert_pvc_info.resources | length > 0

- name: Find any remaining PV bound to cert-pvc
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get pv --no-headers | \
      awk '$0 ~ /{{ core_ns }}\/cert-pvc/ { print $1 }'
  args:
    executable: /bin/bash
  register: cert_pv_dynamic
  changed_when: false

- name: Patch dynamic PV finalizers to unblock deletion
  ansible.builtin.shell: >
    kubectl patch pv {{ cert_pv_dynamic.stdout | trim }}
    -p '{"metadata":{"finalizers":null}}' --type=merge
  when: cert_pv_dynamic.stdout | trim | length > 0
  failed_when: false

- name: Force delete dynamic PV bound to cert-pvc
  ansible.builtin.shell: kubectl delete pv {{ cert_pv_dynamic.stdout | trim }} --force --grace-period=0
  when: cert_pv_dynamic.stdout | trim | length > 0
  failed_when: false

- name: Wait for dynamic PV to be fully deleted
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get pv --no-headers | \
      awk '$0 ~ /{{ core_ns }}\/cert-pvc/ { count++ } END { print count + 0 }'
  args:
    executable: /bin/bash
  register: pv_dynamic_check
  until: pv_dynamic_check.stdout | trim | int == 0
  retries: 30
  delay: 5
  changed_when: false
  when: cert_pv_dynamic.stdout | trim | length > 0

- name: Require dynamic cert PV cleanup to complete
  ansible.builtin.assert:
    quiet: true
    that:
      - pv_dynamic_check.stdout | trim | int == 0
    fail_msg: "A dynamically bound Free5GC cert PV survived cleanup."
  when: cert_pv_dynamic.stdout | trim | length > 0

# ============================================================
# Step 4: Create static PV for cert-pvc
# ============================================================

- name: Ensure cert hostpath directory exists on core node
  delegate_to: "{{ core_node_name }}"
  ansible.builtin.file:
    path: /var/lib/free5gc/cert
    state: directory
    mode: '0755'

- name: Create static PV for cert-pvc
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: cert-pv
        labels:
          project: free5gc
      spec:
        capacity:
          storage: 1Mi
        accessModes:
          - ReadOnlyMany
        persistentVolumeReclaimPolicy: Delete
        storageClassName: openebs-hostpath
        hostPath:
          path: /var/lib/free5gc/cert
          type: DirectoryOrCreate
        nodeAffinity:
          required:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "{{ core_node_name }}"

- name: Wait for cert-pv to be Available
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pv
      - cert-pv
      - -o
      - jsonpath={.status.phase}
  register: pv_status
  until: pv_status.stdout | trim == "Available"
  retries: 20
  delay: 5
  changed_when: false

# ============================================================
# Step 4b: Clean up orphan resources not managed by Helm
# ============================================================

- name: Remove orphan NGAP service if not owned by Helm
  ansible.builtin.shell: |
    set -euo pipefail
    managed_by="$(
      kubectl get svc free5gc-free5gc-amf-amf-n2 -n {{ core_ns }} \
        --ignore-not-found \
        -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}'
    )"
    if [ "$managed_by" = "Helm" ]; then
      echo "owned by Helm, skipping"
    else
      kubectl delete svc free5gc-free5gc-amf-amf-n2 -n {{ core_ns }} --ignore-not-found
      echo "deleted orphan service"
    fi
  args:
    executable: /bin/bash
  register: cleanup_ngap_svc
  changed_when: "'deleted' in cleanup_ngap_svc.stdout"

# ============================================================
# Step 5: Deploy Free5GC via Helm
# ============================================================

- name: Deploy free5gc using Helm
  kubernetes.core.helm:
    name: free5gc
    chart_ref: "{{ [free5gc_repo_dest, 'charts', 'free5gc'] | path_join }}"
    release_namespace: "{{ core_ns }}"
    state: present
    wait: true
    atomic: true
    timeout: 1200s
    values_files:
      - "{{ free5gc_repo_dest }}/values-network-profile-override.yaml"
    values:
      nodeSelector:
        kubernetes.io/hostname: "{{ core_node_name }}"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "{{ core_node_name }}"
      upf:
        privileged: true
        capabilities:
          add:
            - NET_ADMIN
            - SYS_MODULE

# ============================================================
# Step 6: Provision MongoDB subscribers from the effective profile
# ============================================================

- name: Wait for dbpython pod to be Running and Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ core_ns }}"
    label_selectors:
      - app.kubernetes.io/name=free5gc-dbpython
  register: dbpython_pod
  until:
    - dbpython_pod.resources | length == 1
    - dbpython_pod.resources[0].status.phase == "Running"
    - dbpython_pod.resources[0].status.containerStatuses is defined
    - dbpython_pod.resources[0].status.containerStatuses | length > 0
    - dbpython_pod.resources[0].status.containerStatuses |
      selectattr('ready', 'equalto', true) | list | length ==
      dbpython_pod.resources[0].status.containerStatuses | length
  retries: 30
  delay: 10

- name: Wait for MongoDB to be Running and Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ core_ns }}"
    label_selectors:
      - app.kubernetes.io/name=mongodb
  register: mongodb_pod
  until:
    - mongodb_pod.resources | length > 0
    - mongodb_pod.resources[0].status.phase == "Running"
    - mongodb_pod.resources[0].status.containerStatuses is defined
    - mongodb_pod.resources[0].status.containerStatuses | length > 0
    - mongodb_pod.resources[0].status.containerStatuses |
      selectattr('ready', 'equalto', true) | list | length ==
      mongodb_pod.resources[0].status.containerStatuses | length
  retries: 30
  delay: 10

- name: Copy selected-profile subscriber utility to the pinned dbpython path
  ansible.builtin.shell: |
    set -euo pipefail
    pod="$(kubectl get pod -n {{ core_ns }} -l app.kubernetes.io/name=free5gc-dbpython \
      -o jsonpath='{.items[0].metadata.name}')"
    test -n "$pod"
    kubectl cp \
      {{ free5gc_repo_dest }}/docker/free5gc/free5gc-dbpython/add_subscribers.py \
      "{{ core_ns }}/${pod}:/free5gc/add_subscribers.py"
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true

- name: Require the selected-profile subscriber utility at the pinned path
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ core_ns }}"
      - deployment/free5gc-free5gc-dbpython-dbpython
      - --
      - test
      - -f
      - /free5gc/add_subscribers.py
  changed_when: false
  no_log: true

- name: Clean existing Free5GC subscribers
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ core_ns }}"
      - deployment/free5gc-free5gc-dbpython-dbpython
      - --
      - python3
      - /free5gc/add_subscribers.py
      - -a
      - clean
  changed_when: true
  no_log: true

- name: Add selected subscribers from the effective profile
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ core_ns }}"
      - deployment/free5gc-free5gc-dbpython-dbpython
      - --
      - python3
      - /free5gc/add_subscribers.py
      - -a
      - add
  changed_when: true
  no_log: true

# ============================================================
# Step 7: Verify deployment matches the effective profile
# ============================================================

- name: Run Free5GC network-profile verification
  ansible.builtin.include_role:
    name: 5g/free5gc/verify
