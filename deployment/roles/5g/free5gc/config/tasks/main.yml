---
- name: Remove the previous Free5GC source checkout
  ansible.builtin.file:
    path: "{{ free5gc_repo_dest }}"
    state: absent

- name: Clone the immutable Free5GC source revision
  ansible.builtin.git:
    repo: "{{ free5gc_repo_url }}"
    dest: "{{ free5gc_repo_dest }}"
    version: "{{ free5gc_repo_branch }}"
    update: false
    force: true

- name: Stage Free5GC compatibility patchers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0755'
  loop:
    - patch_nads.py
    - patch_amf_n2_nad.py
    - patch_iupf_n3_nad.py
    - patch_upf_wrapper.py

- name: Patch the AMF N2 NAD for OVS CNI
  ansible.builtin.command:
    argv:
      - python3
      - /tmp/patch_amf_n2_nad.py
      - "{{ free5gc_repo_dest }}"
  changed_when: true

- name: Patch the iUPF N3 NAD for OVS CNI
  ansible.builtin.command:
    argv:
      - python3
      - /tmp/patch_iupf_n3_nad.py
      - "{{ free5gc_repo_dest }}"
  changed_when: true

- name: Make Free5GC NAD default routes conditional on configured gateways
  ansible.builtin.command:
    argv:
      - python3
      - /tmp/patch_nads.py
      - "{{ free5gc_repo_dest }}"
  changed_when: true

- name: Make the UPF wrapper create the iproute2 directory
  ansible.builtin.replace:
    path: "{{ free5gc_repo_dest }}/charts/free5gc/charts/free5gc-upf/templates/upf/upf-configmap.yaml"
    regexp: 'echo "1200 n6if" >> /etc/iproute2/rt_tables'
    replace: 'mkdir -p /etc/iproute2 && echo "1200 n6if" >> /etc/iproute2/rt_tables'
  register: free5gc_upf_iproute_patch

- name: Require the UPF iproute2 compatibility patch to match the pinned source
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_upf_iproute_patch.changed
    fail_msg: "The pinned Free5GC UPF iproute2 patch no longer matches its source."

- name: Bind iUPF1 N3 on all pod interfaces
  ansible.builtin.replace:
    path: "{{ free5gc_repo_dest }}/charts/free5gc/charts/free5gc-upf/templates/iupf1/iupf1-configmap.yaml"
    regexp: '(\s*)- addr: \{\{[^}]*\.n3if\.ipAddress[^}]*\}\}(\s*\n\s*type: N3)'
    replace: '\1- addr: 0.0.0.0\2'
  register: free5gc_iupf_n3_bind_patch

- name: Require the iUPF1 N3 bind patch to match the pinned source
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_iupf_n3_bind_patch.changed
    fail_msg: "The pinned Free5GC iUPF1 N3 bind patch no longer matches its source."

- name: Remove spurious iUPF1 default routes and retain N9 routing
  ansible.builtin.replace:
    path: "{{ free5gc_repo_dest }}/charts/free5gc/charts/free5gc-upf/templates/iupf1/iupf1-configmap.yaml"
    regexp: '(    iptables -A FORWARD -j ACCEPT)'
    replace: '\1\n    ip route del default dev n3 2>/dev/null || true\n    ip route | grep "^default" | grep -v "eth0" | while read -r gw via ip dev iface rest; do ip route del default via $ip dev $iface 2>/dev/null || true; done\n    ip route add 10.100.50.224/29 dev n9 2>/dev/null || true'
  register: free5gc_iupf_route_patch

- name: Require the iUPF1 routing patch to match the pinned source
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_iupf_route_patch.changed
    fail_msg: "The pinned Free5GC iUPF1 routing patch no longer matches its source."

- name: Add SYS_ADMIN to the pinned UPF security context
  ansible.builtin.replace:
    path: "{{ free5gc_repo_dest }}/charts/free5gc/charts/free5gc-upf/values.yaml"
    regexp: 'add: \["NET_ADMIN"\]'
    replace: 'add: ["NET_ADMIN", "SYS_ADMIN"]'
  register: free5gc_upf_capability_patch

- name: Require the UPF capability patch to match the pinned source
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_upf_capability_patch.changed
    fail_msg: "The pinned Free5GC UPF capability patch no longer matches its source."

- name: Patch PSA-UPF wrappers for the selected N6 ownership model
  ansible.builtin.command:
    argv:
      - python3
      - /tmp/patch_upf_wrapper.py
      - "{{ free5gc_repo_dest }}"
  changed_when: true

- name: Load the effective SynthRAN network profile
  ansible.builtin.include_vars:
    file: "{{ network_profile_file }}"
    name: fiveg

- name: Validate the effective Free5GC profile
  ansible.builtin.include_tasks: validate_profile.yml

- name: Render Free5GC values from the effective profile
  ansible.builtin.template:
    src: free5gc-values-override.yaml.j2
    dest: "{{ free5gc_repo_dest }}/values-network-profile-override.yaml"
    mode: '0600'
  vars:
    profile: "{{ fiveg }}"

- name: Add the selected colocated gNB route to iUPF1
  ansible.builtin.replace:
    path: "{{ free5gc_repo_dest }}/charts/free5gc/charts/free5gc-upf/templates/iupf1/iupf1-configmap.yaml"
    regexp: '(    ip route add 10\.100\.50\.224/29 dev n9 2>/dev/null \|\| true)'
    replace: '\1\n    ip route add {{ synthran_topology.network.n3.route_cidr }} dev n3 2>/dev/null || true'
  register: free5gc_iupf_selected_route_patch
  when:
    - core_node_name == ran_node_name
    - synthran_topology.network.n3 is defined
    - synthran_topology.network.n3.route_cidr is defined

- name: Require the selected iUPF1 route patch when colocated
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_iupf_selected_route_patch.changed
    fail_msg: "The selected Free5GC iUPF1 route could not be materialized."
  when:
    - core_node_name == ran_node_name
    - synthran_topology.network.n3 is defined
    - synthran_topology.network.n3.route_cidr is defined

- name: Render selected Free5GC subscriber reconciliation utility
  ansible.builtin.template:
    src: add_subscribers.py.j2
    dest: "{{ free5gc_repo_dest }}/docker/free5gc/free5gc-dbpython/add_subscribers.py"
    mode: '0700'
  vars:
    profile: "{{ fiveg }}"
  no_log: true

- name: Render non-secret Free5GC profile check evidence
  ansible.builtin.template:
    src: profile-check.j2
    dest: /root/free5gc_network_profile_check.txt
    owner: root
    mode: '0644'
  vars:
    profile: "{{ fiveg }}"
