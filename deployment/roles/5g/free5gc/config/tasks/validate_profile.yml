---
- name: Validate the effective Free5GC PLMN
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc is defined
      - fiveg.plmn.mnc is defined
      - fiveg.plmn.tac is defined

- name: Validate effective Free5GC slices
  ansible.builtin.assert:
    quiet: true
    that:
      - slice.name is defined
      - slice.sst is defined
      - slice.dnn is defined
      - slice.sd is defined
      - slice.ip_prefix is defined
  loop: "{{ fiveg.slices }}"
  loop_control:
    loop_var: slice
    label: "{{ slice.name }}"

- name: Validate effective Free5GC UE-to-slice references
  ansible.builtin.assert:
    quiet: true
    that:
      - ue.value.slice in fiveg.slices | map(attribute='name') | list
  loop: "{{ fiveg.ues | dict2items }}"
  loop_control:
    loop_var: ue
    label: "{{ ue.key }}"
