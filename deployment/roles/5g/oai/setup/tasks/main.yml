---
- name: Verify the centrally installed yq runtime
  ansible.builtin.command: "{{ yq_bin_path }} --version"
  register: oai_yq_version
  changed_when: false

- name: Require the checksum-verified yq release
  ansible.builtin.assert:
    quiet: true
    that:
      - yq_version in oai_yq_version.stdout
    fail_msg: >-
      OAI setup requires the checksum-verified {{ yq_version }} yq runtime;
      refusing to download an unchecked replacement.

- name: Verify the centrally installed Helm runtime
  ansible.builtin.command: helm version --short
  register: oai_helm_version
  changed_when: false

- name: Require the checksum-verified Helm release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in oai_helm_version.stdout"
    fail_msg: >-
      OAI setup requires the checksum-verified Helm v{{ helm_version }} runtime;
      refusing to execute a moving installer script.

- name: Remove existing OAI directory if it exists
  ansible.builtin.file:
    path: "{{ dir_oai }}"
    state: absent

- name: Ensure OAI directory exists in $HOME
  ansible.builtin.file:
    path: "{{ dir_oai }}"
    state: directory
    mode: '0755'

- name: Checkout the immutable OAI R2Lab helper source
  ansible.builtin.git:
    repo: "{{ repo_oai5g_rru }}"
    dest: "{{ repo_dest }}"
    version: "{{ tag_oai5g_rru }}"
    update: false
    force: true

- name: Read back the OAI helper source revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ repo_dest }}"
      - rev-parse
      - HEAD
  register: oai_helper_revision
  changed_when: false

- name: Require the exact OAI helper source revision
  ansible.builtin.assert:
    quiet: true
    that:
      - oai_helper_revision.stdout | trim == tag_oai5g_rru
    fail_msg: >-
      OAI helper checkout does not match pinned revision {{ tag_oai5g_rru }}.

- name: Checkout the immutable OAI charts source
  ansible.builtin.git:
    repo: "{{ repo_oai_cn5g_fed }}"
    dest: "{{ dir_oai }}/charts"
    version: "{{ tag_oai_cn5g_fed }}"
    update: false
    force: true

- name: Read back the OAI charts source revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ dir_oai }}/charts"
      - rev-parse
      - HEAD
  register: oai_charts_revision
  changed_when: false

- name: Require the exact OAI charts source revision
  ansible.builtin.assert:
    quiet: true
    that:
      - oai_charts_revision.stdout | trim == tag_oai_cn5g_fed
    fail_msg: >-
      OAI charts checkout does not match pinned revision {{ tag_oai_cn5g_fed }}.

- name: Report the immutable OAI source revisions used by this run
  ansible.builtin.debug:
    msg: >-
      OAI sources: helper={{ oai_helper_revision.stdout | trim }},
      charts={{ oai_charts_revision.stdout | trim }}

- name: Install OAI helper scripts from the immutable checkout
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: '0755'
  loop:
    - src: "{{ repo_dest }}/testing/prepare-demo-oai.sh"
      dest: "{{ prepare_demo_script }}"
    - src: "{{ repo_dest }}/configure-demo-oai.sh"
      dest: "{{ dir_oai }}/configure-demo-oai.sh"
    - src: "{{ repo_dest }}/demo-oai.sh"
      dest: "{{ demo_oai_script }}"

- name: Retrieve physical interfaces for multus on the core and ran nodes
  ansible.builtin.set_fact:
    multus_core_if: "{{ hostvars[groups['core_node'][0]].nic_interface }}"
    multus_ran_if: "{{ hostvars[groups['ran_node'][0]].nic_interface }}"
  when: not bridge_enabled

- name: Retrieve topology-selected bridge interfaces for multus
  ansible.builtin.set_fact:
    multus_core_if: "{{ synthran_topology.transport.workload_interfaces.core.n3 }}"
    multus_ran_if: "{{ synthran_topology.transport.workload_interfaces.ran.n3 }}"
  when: bridge_enabled or (core == 'oai' and ran == 'ueransim')

- name: Update NS variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^NS='
    line: "NS=\"{{ core }}\""
    backrefs: true

- name: Determine HOST_AMF_UPF value
  ansible.builtin.set_fact:
    host_amf_upf_value: >-
      {%- if core in ['open5gs', 'free5gc'] -%}
        {{ synthran_topology.network.amf_ip }}
      {%- else -%}
        {{ core_node_name }}
      {%- endif -%}

- name: Update HOST_AMF_UPF variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^HOST_AMF_UPF='
    line: "HOST_AMF_UPF=\"{{ host_amf_upf_value }}\""
    backrefs: true

- name: Update HOST_GNB variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^HOST_GNB='
    line: "HOST_GNB=\"{{ ran_node_name }}\""
    backrefs: true

- name: Update TAG_OAI5G_RRU variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^TAG_OAI5G_RRU='
    line: "TAG_OAI5G_RRU=\"{{ tag_oai5g_rru }}\""
    backrefs: true

- name: Update REPO_OAI5G_RRU variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^REPO_OAI5G_RRU='
    line: "REPO_OAI5G_RRU=\"{{ repo_oai5g_rru }}\""
    backrefs: true

- name: Update TAG_OAI_CN5G_FED variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^TAG_OAI_CN5G_FED='
    line: "TAG_OAI_CN5G_FED=\"{{ tag_oai_cn5g_fed }}\""
    backrefs: true

- name: Update REPO_OAI_CN5G_FED variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^REPO_OAI_CN5G_FED='
    line: "REPO_OAI_CN5G_FED=\"{{ repo_oai_cn5g_fed }}\""
    backrefs: true

- name: Update LOCAL_CORE_INTERFACE variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^LOCAL_CORE_INTERFACE='
    line: "LOCAL_CORE_INTERFACE=\"{{ multus_core_if }}\""
    backrefs: true

- name: Update LOCAL_RAN_INTERFACE variable in prepare-demo-oai.sh
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^LOCAL_RAN_INTERFACE='
    line: "LOCAL_RAN_INTERFACE=\"{{ multus_ran_if }}\""
    backrefs: true

- name: Update RRU variable
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^RRU='
    line: "RRU=\"{{ rru }}\""
    backrefs: true

- name: Update RUN_MODE variable
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^RUN_MODE='
    line: "RUN_MODE=\"{{ 'full' if core == 'oai' else 'gnb-only' }}\""
    backrefs: true

- name: Update CN_MODE variable
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^CN_MODE='
    line: 'CN_MODE="{{ oai_cn_mode }}"'
    backrefs: true
  when: oai_cn_mode is defined

- name: Update GNB_MODE variable
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^GNB_MODE='
    line: 'GNB_MODE="{{ oai_gnb_mode }}"'
    backrefs: true
  when: oai_gnb_mode is defined

- name: Ensure NAD_TYPE_N2N3 is set to ovs when bridge_enabled
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^#?export NAD_TYPE_N2N3='
    line: 'export NAD_TYPE_N2N3="ovs"'
    insertafter: EOF
  when: not (core == 'oai' and core_node_name == ran_node_name and ran != 'ueransim')

- name: Set REDCAP flag when redcap is defined
  ansible.builtin.lineinfile:
    path: "{{ prepare_demo_script }}"
    regexp: '^#?export REDCAP='
    line: 'export REDCAP="{{ redcap }}"'
    insertafter: EOF
  when: redcap is defined

- name: Apply the validated R2Lab N320 transport contract before chart rendering
  ansible.builtin.include_tasks: r2lab_n320.yml
  when:
    - platform == 'r2lab'
    - ran == 'oai'
    - rru == 'n320'

- name: Require staged OAI helper and charts inputs before configuration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ repo_dest }}"
    - "{{ dir_oai }}/charts"
    - "{{ dir_oai }}/configure-demo-oai.sh"
    - "{{ demo_oai_script }}"
  register: oai_staged_inputs

- name: Refuse OAI configuration with missing staged inputs
  ansible.builtin.assert:
    quiet: true
    that:
      - oai_staged_inputs.results | map(attribute='stat.exists') | min
    fail_msg: >-
      OAI source staging is incomplete; refusing to run the upstream configurator.

- name: Configure the staged immutable OAI sources
  ansible.builtin.shell: |
    set -o pipefail
    timeout --signal=TERM 30m bash ./prepare-demo-oai.sh -c 2>&1 |
      tee /tmp/output-prepare-demo-oai.txt
  args:
    chdir: "{{ dir_oai }}"
    executable: /bin/bash
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: prepare_script
  changed_when: "'OAI5G charts are now configured' in prepare_script.stdout"

- name: Check configured OAI deployment artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ repo_dest }}/patch-mysql/oai_db-basic.sql"
    - "{{ charts_base }}/oai-5g-core/oai-5g-{{ oai_cn_mode | default('basic') }}/values.yaml"
    - "{{ charts_base }}/oai-5g-core/oai-5g-{{ oai_cn_mode | default('basic') }}/config.yaml"
    - "{{ charts_base }}/oai-5g-ran"
  register: oai_configured_artifacts

- name: Check for unresolved OAI template placeholders
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - '@DEF_'
      - "{{ demo_oai_script }}"
  register: oai_unresolved_placeholders
  changed_when: false
  failed_when: false

- name: Verify OAI preparation completed
  ansible.builtin.assert:
    quiet: true
    that:
      - "'OAI5G charts are now configured' in prepare_script.stdout"
      - oai_configured_artifacts.results | map(attribute='stat.exists') | min
      - oai_unresolved_placeholders.rc != 0
    fail_msg: >-
      OAI configuration did not produce a complete runnable deployment tree.
      Inspect /tmp/output-prepare-demo-oai.txt on {{ inventory_hostname }}.

- name: Make selected OAI RFSIM UE charts follow the sealed deployment contract
  ansible.builtin.include_tasks: rfsim_ue_contract.yml
  when:
    - platform == 'rfsim'
    - ran | lower == 'oai'
