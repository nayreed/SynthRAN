---
dir_oai: "{{ ansible_env.HOME }}/oai"
repo_dest: "{{ dir_oai }}/oai5g-rru"
prefix_oai5g: "sopnode/oai5g-rru"
repo_oai5g_rru: "https://github.com/{{ prefix_oai5g }}.git"
# Immutable source backing the SynthRAN OAI preparation helper.
tag_oai5g_rru: "9d7f2df8e98527c1a3b05c6352b167e8e9ce7c19"

repo_oai_cn5g_fed: "https://gitlab.eurecom.fr/turletti/charts.git"
# The enclosing SynthRAN play resolves/validates this to one 40-hex commit
# before the upstream preparation script is allowed to run.
tag_oai_cn5g_fed: "{{ synthran_oai_charts_revision }}"

conf: "{{ hostvars[groups['faraday'][0]].conf }}"
prepare_demo_script: "{{ dir_oai }}/prepare-demo-oai.sh"
demo_oai_script: "{{ dir_oai }}/demo-oai.sh"
# prepare-demo-oai.sh and demo-oai.sh expect the charts checkout beside the
# oai5g-rru repository under the deployment prefix.
charts_base: "{{ dir_oai }}/charts"

# R2Lab N320 transport values validated on sopnode-f3. Keep these in one place
# so the staged upstream configuration is corrected before Helm creates the gNB.
oai_r2lab_n320_ru_parent: "r2lab_usrp"
oai_r2lab_n320_ru_ip: "192.168.235.120"
oai_r2lab_n320_ru_prefix: "24"
oai_r2lab_n320_ru_mtu: "9216"
# R2Lab assigns the N320's two 10-Gb/s SFP interfaces to one /24. Keep the
# physical interface identities explicit because Linux's default weak-host ARP
# behaviour can otherwise resolve an endpoint through the other SFP.
oai_r2lab_n320_sfp0_ip: "192.168.235.105"
oai_r2lab_n320_sfp1_ip: "192.168.235.106"
oai_r2lab_n320_sdr_ip: "{{ oai_r2lab_n320_sfp0_ip }}"
oai_r2lab_n320_ssh_user: "root"
oai_r2lab_n320_ru_cni_type: "ipvlan"
oai_r2lab_n320_ru_cni_mode: "l2"

# yq is installed centrally from a checksum-pinned release before this role.
yq_version: "v4.45.1"
yq_bin_path: "/usr/local/bin/yq"
yq_url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_amd64"
