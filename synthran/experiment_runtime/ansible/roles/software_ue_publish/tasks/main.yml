---
- name: Resolve the broker's N6-reachable address
  set_fact:
    synthran_effective_broker_address: >-
      {{ mqtt_broker_address if mqtt_broker_address else
         hostvars[groups['broker_node'][0]].ansible_default_ipv4.address }}

- name: Load the fresh experiment-eligibility decision
  set_fact:
    synthran_experiment_eligibility: >-
      {{ lookup('ansible.builtin.file', run_dir ~ '/experiment-eligible.json') | from_json }}
    synthran_experiment_eligibility_evidence: >-
      {{ lookup('ansible.builtin.file', run_dir ~ '/experiment-eligibility-evidence.json') | from_json }}

- name: Require a fresh eligibility decision for this accepted deployment
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_experiment_eligibility.status == 'experiment-eligible'
      - synthran_experiment_eligibility.experiment_eligible is sameas true
      - >-
        synthran_experiment_eligibility.deployment_hash
        == synthran_experiment_eligibility_evidence.deployment_hash
      - synthran_experiment_eligibility_evidence.cluster_identity_verified is sameas true
      - synthran_experiment_eligibility_evidence.bindings | length == synthran_ue_map | length
    fail_msg: >-
      Software workload replay requires the fresh experiment-eligibility decision
      produced immediately before this run. Experiment code cannot manufacture or
      substitute deployment acceptance evidence.

- name: Use the freshly proved software UE bindings in accepted order
  set_fact:
    synthran_assigned_tunnels: "{{ synthran_experiment_eligibility_evidence.bindings }}"

- name: Build unique UE pod list
  set_fact:
    synthran_software_pods: "{{ synthran_assigned_tunnels | unique(attribute='pod') | list }}"

- name: Inspect existing publisher runtime containers
  command: >-
    {{ kubectl_bin | default('/usr/bin/kubectl') }} get pod -n {{ item.namespace }} {{ item.pod }}
    -o jsonpath='{.spec.ephemeralContainers[?(@.name=="synthran-runtime")].name}'
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  register: synthran_runtime_specs
  changed_when: false

- name: Inspect publisher runtime running state
  command: >-
    {{ kubectl_bin | default('/usr/bin/kubectl') }} get pod -n {{ item.namespace }} {{ item.pod }}
    -o jsonpath='{.status.ephemeralContainerStatuses[?(@.name=="synthran-runtime")].state.running.startedAt}'
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  register: synthran_runtime_states
  changed_when: false

- name: Require any existing publisher runtime to still be running
  ansible.builtin.assert:
    that:
      - >-
        (synthran_runtime_specs.results[item_index].stdout | trim == '') or
        (synthran_runtime_states.results[item_index].stdout | trim != '')
    fail_msg: >-
      The existing synthran-runtime ephemeral container in
      {{ item.namespace }}/{{ item.pod }} has stopped and Kubernetes cannot
      restart ephemeral containers. Recreate the UE pod before replay.
  loop: "{{ synthran_software_pods }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.pod }}"
    index_var: item_index

- name: Add isolated publisher runtime to each UE pod network namespace
  command: >-
    {{ kubectl_bin | default('/usr/bin/kubectl') }} debug -n {{ item.namespace }} pod/{{ item.pod }}
    --image={{ synthran_runtime_image | default('python:3.13.7-slim-bookworm@sha256:adafcc17694d715c905b4c7bebd96907a1fd5cf183395f0ebc4d3428bd22d92d') }}
    --container=synthran-runtime -- sleep infinity
  loop: "{{ synthran_software_pods }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.pod }}"
    index_var: item_index
  when: synthran_runtime_specs.results[item_index].stdout | trim == ''
  changed_when: true
- name: Wait for publisher runtime containers
  shell: >-
    test "$(kubectl get pod -n {{ item.namespace }} {{ item.pod }}
    -o jsonpath='{.status.ephemeralContainerStatuses[?(@.name=="synthran-runtime")].state.running.startedAt}')" != ""
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  register: synthran_runtime_wait
  changed_when: false
  retries: 30
  delay: 2
  until: synthran_runtime_wait.rc == 0

- name: Reset runtime staging directory
  file: {path: /tmp/synthran-build, state: absent}
- name: Stage SynthRAN package on RAN node
  copy: {src: "{{ run_dir }}/runtime/", dest: /tmp/synthran-build/}
- name: Stage immutable workload trace on RAN node
  copy: {src: "{{ run_dir }}/model/events.jsonl", dest: /tmp/synthran-events.jsonl}
- name: Copy package into every publisher runtime
  command: >-
    kubectl cp -n {{ item.namespace }} -c synthran-runtime
    /tmp/synthran-build/. {{ item.pod }}:/opt/synthran-runtime
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
- name: Copy trace into every publisher runtime
  command: >-
    kubectl cp -n {{ item.namespace }} -c synthran-runtime
    /tmp/synthran-events.jsonl {{ item.pod }}:/opt/synthran-events.jsonl
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
- name: Install the exact MQTT dependency inside publisher runtimes
  command: >-
    kubectl exec -n {{ item.namespace }} {{ item.pod }} -c synthran-runtime --
    python3 -m pip install --disable-pip-version-check --no-input "paho-mqtt==2.1.0"
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}

- name: Verify the exact MQTT dependency inside publisher runtimes
  command: >-
    kubectl exec -n {{ item.namespace }} {{ item.pod }} -c synthran-runtime --
    python3 -c "import importlib.metadata; assert importlib.metadata.version('paho-mqtt') == '2.1.0'"
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  changed_when: false

- name: Verify publisher runtimes do not require the numerical model stack
  command: >-
    kubectl exec -n {{ item.namespace }} {{ item.pod }} -c synthran-runtime --
    env PYTHONPATH=/opt/synthran-runtime python3 -c
    "from synthran.workload.replay import replay"
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  changed_when: false

- name: Install the software publisher password outside process arguments
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin | default('/usr/bin/kubectl') }}"
      - exec
      - -i
      - -n
      - "{{ item.namespace }}"
      - "{{ item.pod }}"
      - -c
      - synthran-runtime
      - --
      - sh
      - -c
      - 'umask 077; cat > /opt/synthran-mqtt-password'
    stdin: "{{ mqtt_publisher_password }}\n"
  loop: "{{ synthran_software_pods }}"
  loop_control: {label: "{{ item.namespace }}/{{ item.pod }}"}
  no_log: true
  changed_when: true

- name: Remove legacy SynthRAN policy routing from OAI UE pods
  shell: >-
    kubectl exec -n {{ item.namespace }} {{ item.pod }}
    -c {{ item.container }} -- sh -lc
    'src=$(ip -4 -o addr show dev {{ item.interface }} | awk "{print \$4}" | cut -d/ -f1);
    changed=0;
    while ip rule del from "$src"/32 table {{ 100 + item.index }} 2>/dev/null; do changed=1; done;
    if ip route show table {{ 100 + item.index }} | grep -q .; then
      ip route flush table {{ 100 + item.index }};
      changed=1;
    fi;
    echo "$changed"'
  loop: "{{ synthran_assigned_tunnels }}"
  loop_control: {label: "{{ item.device }} via OAI-native routing"}
  register: synthran_oai_route_cleanup
  changed_when: synthran_oai_route_cleanup.stdout | trim == '1'
  when: ran == 'oai'

- name: Configure source-policy routing for non-OAI software UEs
  shell: >-
    kubectl exec -n {{ synthran_assigned_tunnels[item.index - 1].namespace }}
    {{ synthran_assigned_tunnels[item.index - 1].pod }}
    -c {{ synthran_assigned_tunnels[item.index - 1].container }} -- sh -lc
    'src=$(ip -4 -o addr show dev {{ synthran_assigned_tunnels[item.index - 1].interface }} | awk "{print \$4}" | cut -d/ -f1);
    ip rule del priority {{ 1000 + item.index }} 2>/dev/null || true;
    ip rule add priority {{ 1000 + item.index }} from "$src"/32 table {{ 100 + item.index }};
    ip route replace default dev {{ synthran_assigned_tunnels[item.index - 1].interface }} table {{ 100 + item.index }}'
  loop: "{{ synthran_ue_map }}"
  loop_control: {label: "{{ item.device }} via {{ synthran_assigned_tunnels[item.index - 1].interface }}"}
  changed_when: true
  when: ran != 'oai'

- name: Prove MQTT reachability through every assigned UE tunnel
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin | default('/usr/bin/kubectl') }}"
      - exec
      - -n
      - "{{ item.namespace }}"
      - "{{ item.pod }}"
      - -c
      - synthran-runtime
      - --
      - python3
      - -c
      - >-
        import socket; s=socket.create_connection(("{{ synthran_effective_broker_address }}", {{ mqtt_port | int }}), 5, ("{{ item.address }}", 0)); s.close()
  loop: "{{ synthran_assigned_tunnels }}"
  loop_control: {label: "{{ item.device }} via {{ item.address }}"}
  register: synthran_mqtt_path_probe
  changed_when: false
  retries: 30
  delay: 2
  until: synthran_mqtt_path_probe.rc == 0

- name: Bound publisher wait to the immutable trace horizon
  ansible.builtin.set_fact:
    synthran_publish_timeout_seconds: >-
      {{ (mqtt_start_delay_seconds | int) + (synthran_replay_horizon_seconds | float | round(0, 'ceil') | int) + (mqtt_drain_seconds | float | round(0, 'ceil') | int) + 30 }}
    synthran_publish_poll_retries: >-
      {{ (((mqtt_start_delay_seconds | int) + (synthran_replay_horizon_seconds | float | round(0, 'ceil') | int) + (mqtt_drain_seconds | float | round(0, 'ceil') | int) + 35) // 5) | int }}

- name: Choose one shared UTC start after every UE is attached
  set_fact:
    synthran_replay_start_utc: "{{ lookup('pipe', 'date -u -d +' ~ (mqtt_start_delay_seconds | string) ~ 'seconds +%Y-%m-%dT%H:%M:%SZ') }}"
- name: Replay each device through its assigned UE tunnel
  command: >-
    kubectl exec -n {{ synthran_assigned_tunnels[item.index - 1].namespace }}
    {{ synthran_assigned_tunnels[item.index - 1].pod }} -c synthran-runtime --
    env PYTHONPATH=/opt/synthran-runtime python3 -m synthran.cli workload replay
    --trace /opt/synthran-events.jsonl --gateway {{ item.device }}
    --broker {{ synthran_effective_broker_address }} --port {{ mqtt_port }} --qos {{ mqtt_qos }}
    --username {{ mqtt_publisher_username }} --password-file /opt/synthran-mqtt-password
    --bind-address {{ synthran_assigned_tunnels[item.index - 1].address }}
    --start-utc {{ synthran_replay_start_utc }}
    --horizon-seconds {{ synthran_replay_horizon_seconds }} --drain-seconds {{ mqtt_drain_seconds }}
    --max-inflight {{ mqtt_max_inflight }} --max-queued {{ mqtt_max_queued }}
    --output /tmp/publisher-{{ run_dir | basename }}-{{ item.device }}.jsonl
  loop: "{{ synthran_ue_map }}"
  loop_control: {label: "{{ item.device }}"}
  async: "{{ synthran_publish_timeout_seconds }}"
  poll: 0
  register: synthran_publish_jobs
- name: Wait for publishers
  async_status: {jid: "{{ item.ansible_job_id }}"}
  loop: "{{ synthran_publish_jobs.results }}"
  loop_control: {label: "{{ item.item.device }}"}
  register: synthran_publish_status
  until: synthran_publish_status.finished
  retries: "{{ synthran_publish_poll_retries }}"
  delay: 5

- name: Read publisher JSONL
  command: >-
    kubectl exec -n {{ synthran_assigned_tunnels[item.index - 1].namespace }}
    {{ synthran_assigned_tunnels[item.index - 1].pod }} -c synthran-runtime --
    cat /tmp/publisher-{{ run_dir | basename }}-{{ item.device }}.jsonl
  loop: "{{ synthran_ue_map }}"
  loop_control: {label: "{{ item.device }}"}
  register: synthran_publisher_artifacts
  changed_when: false
- name: Save publisher JSONL
  delegate_to: localhost
  become: false
  copy:
    content: "{{ item.stdout }}{{ '\n' if item.stdout else '' }}"
    dest: "{{ run_dir }}/publisher-{{ item.item.device }}.jsonl"
  loop: "{{ synthran_publisher_artifacts.results }}"
  loop_control: {label: "{{ item.item.device }}"}
- name: Collect native UE container logs
  command: >-
    kubectl logs -n {{ synthran_assigned_tunnels[item.index - 1].namespace }}
    {{ synthran_assigned_tunnels[item.index - 1].pod }}
    -c {{ synthran_assigned_tunnels[item.index - 1].container }}
  loop: "{{ synthran_ue_map }}"
  loop_control: {label: "{{ item.device }}"}
  register: synthran_native_ue_logs
  changed_when: false
- name: Save native UE logs
  delegate_to: localhost
  become: false
  copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ run_dir }}/ue-{{ item.item.device }}.log"
  loop: "{{ synthran_native_ue_logs.results }}"
  loop_control: {label: "{{ item.item.device }}"}
