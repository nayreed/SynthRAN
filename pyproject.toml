[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthran"
version = "0.1.0"
description = "Ambient-IoT modelling and reproducible 5G research experimentation"
readme = "README.md"
authors = [{ name = "Rezwan Ahmad Nayreed" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/NOTICE.md", "third_party/amber/LICENSE"]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
experiment = ["numpy==2.4.6", "pandas==3.0.6", "simpy==4.1.2", "paho-mqtt==2.1.0"]
analysis = ["matplotlib==3.11.2", "openpyxl==3.1.5"]
deployment = ["ansible-core==2.19.13"]

[tool.setuptools.package-data]
synthran = ["data/*.csv", "configs/*.yml", "experiment_runtime/**/*.yml", "experiment_runtime/**/*.j2"]
"synthran.ambient_iot" = ["examples/*.yml", "examples/README.md"]

[tool.setuptools.packages.find]
include = ["synthran", "synthran.*"]
exclude = ["deployment*", "results*", "third_party*", "Experiments*"]
